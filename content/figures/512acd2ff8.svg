<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" style="display: block; margin: 0 auto; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px;">
  <line x1="20" y1="100" x2="280" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <line x1="150" y1="20" x2="150" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <text x="275" y="114" font-size="12" fill="#64748b" font-weight="bold">x</text>
  <text x="156" y="18" font-size="12" fill="#64748b" font-weight="bold">y</text>
  <!-- y=1 for x>0 -->
  <line x1="154" y1="72" x2="270" y2="72" stroke="#6366f1" stroke-width="2.5"/>
  <circle cx="154" cy="72" r="4" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <!-- y=-1 for x<0 -->
  <line x1="30" y1="128" x2="146" y2="128" stroke="#6366f1" stroke-width="2.5"/>
  <circle cx="146" cy="128" r="4" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <!-- hole at origin -->
  <circle cx="150" cy="100" r="4" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="64" font-size="10" fill="#6366f1" font-weight="bold">y = 1 (x &gt; 0)</text>
  <text x="40" y="144" font-size="10" fill="#6366f1" font-weight="bold">y = -1 (x &lt; 0)</text>
  <text x="158" y="114" font-size="9" fill="#ef4444">undefined at 0</text>
</svg>