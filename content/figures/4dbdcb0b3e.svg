<svg width="300" height="130" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130">
  <rect width="300" height="130" fill="#fffbeb" rx="8"/>
  <text x="150" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e" font-weight="bold">Cosine Rule Calculation:</text>
  <text x="150" y="55" text-anchor="middle" font-family="serif" font-size="13" fill="#374151">cos a = (100² + 130² − 35²) / (2×100×130)</text>
  <text x="150" y="78" text-anchor="middle" font-family="serif" font-size="13" fill="#374151">= 25675 / 26000 ≈ 0.9875</text>
  <line x1="30" y1="88" x2="270" y2="88" stroke="#d1d5db" stroke-width="1"/>
  <text x="150" y="112" text-anchor="middle" font-family="serif" font-size="15" fill="#059669" font-weight="bold">a = cos⁻¹(0.9875) ≈ 9°</text>
</svg>