<svg viewBox="0 0 400 150" width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="50" width="100" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="5" />
  <text x="70" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0369a1" text-anchor="middle">Swimming</text>
  <text x="70" y="115" font-family="sans-serif" font-size="14" fill="#0369a1" text-anchor="middle">Speed = x</text>
  
  <rect x="150" y="50" width="100" height="40" fill="#fef08a" stroke="#ca8a04" stroke-width="2" rx="5" />
  <text x="200" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#a16207" text-anchor="middle">Running</text>
  <text x="200" y="115" font-family="sans-serif" font-size="14" fill="#a16207" text-anchor="middle">Speed = R</text>
  
  <rect x="280" y="50" width="100" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="5" />
  <text x="330" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#15803d" text-anchor="middle">Cycling</text>
  <text x="330" y="115" font-family="sans-serif" font-size="14" fill="#15803d" text-anchor="middle">Speed = C</text>
  
  <path d="M 125 70 L 140 70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 255 70 L 270 70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>