<svg viewBox="0 0 400 250" width="100%" height="auto" style="max-width:400px;display:block;margin:1rem auto;background-color:#f8fafc;border-radius:16px;border:1px solid #e2e8f0;padding:1rem;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ca8a04"/></marker>
  </defs>
  <!-- Bottom pacman (hidden and visible arcs) -->
  <path d="M 200 200 L 250 200 A 50 20 0 1 1 200 180 Z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 200 200 L 250 200 A 50 20 0 0 1 150 200" fill="none" stroke="#475569" stroke-width="2"/>
  
  <!-- Vertical edges -->
  <!-- Inner center edge (Solid) -->
  <line x1="200" y1="80" x2="200" y2="200" stroke="#475569" stroke-width="2"/>
  <!-- Right cut edge (Solid) -->
  <line x1="250" y1="80" x2="250" y2="200" stroke="#475569" stroke-width="2"/>
  <!-- Top cut edge (Hidden? No, the slice is taken out from the top right quadrant in 3D perspective. Wait, if pacman mouth is open to top right...) -->
  <!-- Let's just draw the top face solid pacman, and connect outer bounds -->
  <line x1="150" y1="80" x2="150" y2="200" stroke="#475569" stroke-width="2"/>
  
  <!-- Top pacman -->
  <path d="M 200 80 L 250 80 A 50 20 0 1 1 200 60 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round"/>

  <line x1="260" y1="80" x2="260" y2="200" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="270" y="145" font-family="sans-serif" font-size="14" fill="#475569">2 cm</text>

  <path d="M 215 80 A 15 6 0 1 1 200 74" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>
  
  <text x="170" y="100" font-family="sans-serif" font-size="14" stroke="#fde047" stroke-width="4" stroke-linejoin="round" text-anchor="middle">270°</text>
  <text x="170" y="100" font-family="sans-serif" font-size="14" fill="#a16207" font-weight="bold" text-anchor="middle">270°</text>

  <text x="225" y="72" font-family="sans-serif" font-size="14" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" text-anchor="middle">4 cm</text>
  <text x="225" y="72" font-family="sans-serif" font-size="14" fill="#a16207" text-anchor="middle">4 cm</text>
  
</svg>