<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 60' width='300' height='60' font-family='sans-serif'>
  <!-- Number line base -->
  <line x1='0' y1='30' x2='300' y2='30' stroke='#94a3b8' stroke-width='2'/>
  <!-- Ticks -->
  <line x1='50' y1='25' x2='50' y2='35' stroke='#94a3b8' stroke-width='2'/>
  <line x1='150' y1='25' x2='150' y2='35' stroke='#94a3b8' stroke-width='2'/>
  <line x1='250' y1='25' x2='250' y2='35' stroke='#94a3b8' stroke-width='2'/>
  <!-- Labels -->
  <text x='50' y='50' text-anchor='middle' fill='#64748b' font-size='12'>2</text>
  <text x='150' y='50' text-anchor='middle' fill='#64748b' font-size='12'>3</text>
  <text x='250' y='50' text-anchor='middle' fill='#64748b' font-size='12'>4</text>
  
  <!-- Inequality path -->
  <line x1='150' y1='30' x2='290' y2='30' stroke='#2563eb' stroke-width='3'/><polygon points='290,25 300,30 290,35' fill='#2563eb'/>
  <!-- Circle -->
  <circle cx='150' cy='30' r='5' fill='white' stroke='#2563eb' stroke-width='2'/>
</svg>