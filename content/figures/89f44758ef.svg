<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>
  <rect width='300' height='300' fill='#ffffff' />
  
  <circle cx='150' cy='150' r='100' fill='none' stroke='#cbd5e1' stroke-width='1.5' />
  
  <line x1='50' y1='150' x2='250' y2='150' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  <line x1='50' y1='150' x2='200' y2='63.39745962155614' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  <line x1='250' y1='150' x2='200' y2='63.39745962155614' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  
  <!-- Line POM -->
  <line x1='200' y1='63.39745962155614' x2='120' y2='201.96152422706632' stroke='#ef4444' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4' />

  <!-- Angles -->
  <!-- alpha at A: P is -30 deg, B is 0. Sweep flag 1 -->
  <path d='M 75.98076211353316 135 A 30 30 0 0 1 80 150' fill='none' stroke='#f59e0b' stroke-width='1.5' stroke-linecap='round' />
  <text x='88.63703305156272' y='144.64723819589918' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#d97706'>α</text>

  <!-- beta at B: A is 180 deg, P is roughly -120 deg. -->
  <path d='M 220 150 A 30 30 0 0 1 235 124.01923788646684' fill='none' stroke='#8b5cf6' stroke-width='1.5' stroke-linecap='round' />
  <text x='215.35898384862244' y='130' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#7c3aed'>β</text>

  <!-- 2alpha at O: M is roughly 120 deg, A is 180 deg. -->
  <path d='M 140 167.32050807568876 A 20 20 0 0 1 130 150' fill='none' stroke='#f59e0b' stroke-width='1.5' stroke-linecap='round' />
  <text x='122.28718707889796' y='170' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#d97706'>2α</text>

  <!-- 2beta at O: B is 0 deg, M is roughly 120 deg. -->
  <path d='M 175 150 A 25 25 0 0 1 137.5 171.65063509461098' fill='none' stroke='#8b5cf6' stroke-width='1.5' stroke-linecap='round' />
  <text x='167.5' y='184.31088913245534' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#7c3aed'>2β</text>

  <!-- Points -->
  <circle cx='150' cy='150' r='3' fill='#94a3b8' stroke='#ffffff' stroke-width='1.5' />
  <text x='158' y='142' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>O</text>
  
  <circle cx='50' cy='150' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='38' y='154' text-anchor='end' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>A</text>
  
  <circle cx='250' cy='150' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='262' y='154' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>B</text>
  
  <circle cx='200' cy='63.39745962155614' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='208' y='55.39745962155614' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>P</text>

  <text x='112' y='217.96152422706632' text-anchor='end' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>M</text>
</svg>