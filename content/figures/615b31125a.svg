<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img">
<style>
text { font-family: Arial, sans-serif; fill: #263449; font-size: 20px; }
.solid { stroke: #34445a; stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.dashed { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; fill: none; stroke-linecap: round; }
.topface { fill: #dceafe; fill-opacity: 0.4; stroke: #34445a; stroke-width: 3; stroke-linejoin: round; }
.sideface { fill: #dceafe; fill-opacity: 0.15; stroke: none; }
.slice { fill: #f7c76b; fill-opacity: 0.9; stroke: none; }
.slice-edge { stroke: #e28a00; stroke-width: 3; stroke-linejoin: round; fill: none; stroke-linecap: round; }
.slice-dashed { stroke: #e28a00; stroke-width: 2; stroke-dasharray: 6 5; fill: none; stroke-linecap: round; }
</style>

<!-- Hidden Prism Edges -->
<path d="M 170 230 L 240 190 L 380 190 L 450 230" class="dashed"/>
<path d="M 240 50 L 240 190" class="dashed"/>
<path d="M 380 50 L 380 190" class="dashed"/>

<!-- Slice Back (Hidden) Edges -->
<path d="M 170 160 L 240 120 L 380 120 L 450 160" class="slice-dashed"/>

<!-- Slice Fill -->
<path d="M 170 160 L 240 120 L 380 120 L 450 160 L 380 200 L 240 200 Z" class="slice"/>

<!-- Slice Front (Visible) Edges -->
<path d="M 450 160 L 380 200 L 240 200 L 170 160" class="slice-edge"/>

<!-- Prism Side Faces (Front) -->
<path d="M 170 90 L 240 130 L 240 270 L 170 230 Z" class="sideface"/>
<path d="M 240 130 L 380 130 L 380 270 L 240 270 Z" class="sideface"/>
<path d="M 380 130 L 450 90 L 450 230 L 380 270 Z" class="sideface"/>

<!-- Top Face (Semi-transparent) -->
<path d="M 170 90 L 240 50 L 380 50 L 450 90 L 380 130 L 240 130 Z" class="topface"/>

<!-- Prism Vertical Visible Edges -->
<path d="M 170 90 L 170 230" class="solid"/>
<path d="M 240 130 L 240 270" class="solid"/>
<path d="M 380 130 L 380 270" class="solid"/>
<path d="M 450 90 L 450 230" class="solid"/>

<!-- Prism Bottom Visible Edges -->
<path d="M 170 230 L 240 270 L 380 270 L 450 230" class="solid"/>

<text x="310" y="335" text-anchor="middle">cross-section parallel to the ends</text>
</svg>