<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>\n  <!-- Background -->\n  <rect width='300' height='300' fill='#f8fafc' />\n  \n  <!-- Grid (10px = 1 unit) -->\n  <g stroke='#e2e8f0' stroke-width='1'>\n    <line x1='0' y1='50' x2='300' y2='50' />\n    <line x1='0' y1='100' x2='300' y2='100' />\n    <line x1='0' y1='200' x2='300' y2='200' />\n    <line x1='0' y1='250' x2='300' y2='250' />\n    <line x1='50' y1='0' x2='50' y2='300' />\n    <line x1='100' y1='0' x2='100' y2='300' />\n    <line x1='200' y1='0' x2='200' y2='300' />\n    <line x1='250' y1='0' x2='250' y2='300' />\n  </g>\n  \n  <!-- Axes -->\n  <line x1='0' y1='150' x2='300' y2='150' stroke='#94a3b8' stroke-width='2' />\n  <line x1='150' y1='0' x2='150' y2='300' stroke='#94a3b8' stroke-width='2' />\n  \n  <!-- Circle (r=10 -> 100px) -->\n  <circle cx='150' cy='150' r='100' fill='rgba(99, 102, 241, 0.05)' stroke='#6366f1' stroke-width='2' />\n  <text x='160' y='55' font-family='sans-serif' font-size='12' font-weight='bold' fill='#4f46e5'>x² + y² = 100</text>\n  \n  <!-- Square ABCD -->\n  <polygon points='230,210 210,70 70,90 90,230' fill='none' stroke='#1e293b' stroke-width='2' />\n  \n  <!-- Points -->\n  <!-- A(8, -6) -> x=150+80=230, y=150+60=210 -->\n  <circle cx='230' cy='210' r='4' fill='#ef4444' />\n  <text x='238' y='215' font-family='sans-serif' font-size='12' font-weight='bold' fill='#0f172a'>A(8, -6)</text>\n  \n  <!-- B(6, 8) -> x=150+60=210, y=150-80=70 -->\n  <circle cx='210' cy='70' r='4' fill='#ef4444' />\n  <text x='218' y='65' font-family='sans-serif' font-size='12' font-weight='bold' fill='#0f172a'>B(6, 8)</text>\n  \n  <!-- C(-8, 6) -> x=150-80=70, y=150-60=90 -->\n  <circle cx='70' cy='90' r='4' fill='#ef4444' />\n  <text x='15' y='85' font-family='sans-serif' font-size='12' font-weight='bold' fill='#0f172a'>C(-8, 6)</text>\n  \n  <!-- D(-6, -8) -> x=150-60=90, y=150+80=230 -->\n  <circle cx='90' cy='230' r='4' fill='#ef4444' />\n  <text x='20' y='235' font-family='sans-serif' font-size='12' font-weight='bold' fill='#0f172a'>D(-6, -8)</text>\n  \n  <!-- Origin -->\n  <circle cx='150' cy='150' r='3' fill='#64748b' />\n  <text x='155' y='145' font-family='sans-serif' font-size='12' fill='#64748b'>O</text>\n</svg>