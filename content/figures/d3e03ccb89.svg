<svg width="240" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- Triangle: right angle at bottom-right -->
  <polygon points="30,130 210,130 210,50" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <!-- Right angle box -->
  <rect x="198" y="118" width="12" height="12" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Angle arc at bottom-left (θ) -->
  <path d="M 65,130 A 35,35 0 0 0 52,104" fill="none" stroke="#e11d48" stroke-width="2"/>
  <text x="62" y="122" font-family="serif" font-style="italic" font-size="16" fill="#e11d48">θ</text>
  <!-- Labels -->
  <!-- Hypotenuse (slant): 2 -->
  <text x="105" y="80" font-family="serif" font-size="15" fill="#1d4ed8" text-anchor="middle" transform="rotate(-22, 120, 90)">2 (hyp)</text>
  <!-- Opposite (vertical): 1 -->
  <text x="220" y="98" font-family="serif" font-size="15" fill="#059669">1 (opp)</text>
  <!-- Adjacent (horizontal): √3 -->
  <text x="105" y="148" font-family="serif" font-size="15" fill="#7c3aed" text-anchor="middle">√3 (adj)</text>
</svg>