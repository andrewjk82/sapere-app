<svg width="440" height="320" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="320" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Info Badge -->
  <rect x="20" y="14" width="400" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">
    Given: PM ⟂ RS and PR = PS
  </text>

  <!-- Triangle Fill -->
  <polygon points="220,60 100,250 340,250" fill="#f8fafc" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Altitude PM -->
  <line x1="220" y1="60" x2="220" y2="250" stroke="#334155" stroke-width="2"/>

  <!-- Right Angle Marks at M -->
  <path d="M 220 234 L 204 234 L 204 250" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <path d="M 220 234 L 236 234 L 236 250" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>

  <!-- Tick mark on PR (midpoint 160, 155) -->
  <line x1="153" y1="151" x2="167" y2="159" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tick mark on PS (midpoint 280, 155) -->
  <line x1="273" y1="159" x2="287" y2="151" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vertex Points -->
  <circle cx="220" cy="60" r="4.5" fill="#1e293b"/>
  <circle cx="100" cy="250" r="4.5" fill="#1e293b"/>
  <circle cx="340" cy="250" r="4.5" fill="#1e293b"/>
  <circle cx="220" cy="250" r="4" fill="#2563eb"/>

  <!-- Labels -->
  <text x="220" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#0f172a">P</text>
  <text x="82" y="266" text-anchor="end" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#0f172a">R</text>
  <text x="358" y="266" text-anchor="start" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#0f172a">S</text>
  <text x="220" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#0f172a">M</text>

  <!-- Side Annotations -->
  <rect x="96" y="138" width="46" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#shadow)"/>
  <text x="119" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" font-weight="bold" fill="#b91c1c">PR</text>

  <rect x="298" y="138" width="46" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#shadow)"/>
  <text x="321" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" font-weight="bold" fill="#b91c1c">PS</text>

  <!-- Bottom note -->
  <rect x="135" y="286" width="170" height="22" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">
    PM ⟂ RS &amp; PR = PS
  </text>
</svg>