<svg width="500" height="340" viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="500" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step Banner -->
  <rect x="20" y="14" width="460" height="28" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="250" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">
    Step 2: Mathematical Proof for Non-Commuting Pairs (Result: N)
  </text>

  <!-- Pair 1 Box: y-axis reflection & HT -->
  <rect x="20" y="52" width="460" height="74" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="35" y="70" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">
    Pair 1: Reflection in y-axis (HD, factor −1) and Horizontal Translation (HT, shift +c)
  </text>
  <text x="35" y="88" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 1 (Translate then Reflect): x → x − c → −(x − c) = <tspan font-weight="700" fill="#b91c1c">−x + c</tspan>
  </text>
  <text x="35" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 2 (Reflect then Translate): x → −x → <tspan font-weight="700" fill="#b91c1c">−x − c</tspan>
  </text>
  <text x="460" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">−x + c ≠ −x − c ⇒ N</text>

  <!-- Pair 2 Box: VD & VT -->
  <rect x="20" y="136" width="460" height="74" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="35" y="154" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">
    Pair 2: Vertical Dilation (VD, factor a) and Vertical Translation (VT, shift +k)
  </text>
  <text x="35" y="172" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 1 (Shift then Scale): y → y + k → a(y + k) = <tspan font-weight="700" fill="#b91c1c">ay + ak</tspan>
  </text>
  <text x="35" y="188" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 2 (Scale then Shift): y → ay → <tspan font-weight="700" fill="#b91c1c">ay + k</tspan>
  </text>
  <text x="460" y="182" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">ay + ak ≠ ay + k ⇒ N</text>

  <!-- Pair 5 Box: HD & HT -->
  <rect x="20" y="220" width="460" height="74" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="35" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">
    Pair 5: Horizontal Dilation (HD, factor k) and Horizontal Translation (HT, shift +c)
  </text>
  <text x="35" y="256" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 1 (Translate then Dilate): x → x − c → k(x − c) = <tspan font-weight="700" fill="#b91c1c">kx − kc</tspan>
  </text>
  <text x="35" y="272" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">
    • Order 2 (Dilate then Translate): x → kx → <tspan font-weight="700" fill="#b91c1c">kx − c</tspan>
  </text>
  <text x="460" y="266" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">kx − kc ≠ kx − c ⇒ N</text>

  <!-- Bottom Conclusion -->
  <text x="250" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">
    All 3 same-direction mixed pairs strictly do not commute: Table entry = N.
  </text>
</svg>