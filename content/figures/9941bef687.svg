<svg width="500" height="340" viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="500" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step Banner -->
  <rect x="20" y="14" width="460" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="250" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">
    Step 1: The Three Core Rules of Transformation Commutativity
  </text>

  <!-- Rule Card 1: Different Directions (H vs V) -->
  <rect x="20" y="54" width="460" height="74" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="66" width="32" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="48" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#15803d">C</text>
  <text x="76" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Rule 1: Cross-Direction Transformations (Horizontal ↔ Vertical)</text>
  <text x="76" y="98" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Operations on x and operations on y are independent and never interfere.</text>
  <text x="76" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d">HT ↔ VT (C),  HD ↔ VT (C),  HT ↔ VD (C),  HD ↔ VD (C)</text>

  <!-- Rule Card 2: Same Direction, Same Type (T ↔ T, D ↔ D) -->
  <rect x="20" y="140" width="460" height="74" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="152" width="32" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="48" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#15803d">C</text>
  <text x="76" y="166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Rule 2: Same Direction &amp; Same Operation Type</text>
  <text x="76" y="184" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Two translations add: (x−c₁)−c₂ = x−(c₁+c₂). Two dilations multiply: a₁(a₂y) = (a₁a₂)y.</text>
  <text x="76" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d">HT ↔ HT (C),  VT ↔ VT (C),  HD ↔ HD (C),  VD ↔ VD (C)</text>

  <!-- Rule Card 3: Same Direction, Mixed Type (T ↔ D) -->
  <rect x="20" y="226" width="460" height="78" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="240" width="32" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="48" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#b91c1c">N</text>
  <text x="76" y="252" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Rule 3: Same Direction &amp; Mixed Type (Translation ↔ Dilation)</text>
  <text x="76" y="270" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Dilating first scales only the variable; translating first means the dilation also scales the shift!</text>
  <text x="76" y="288" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">HD ↔ HT (N) [k(x−c) ≠ kx−c],   VD ↔ VT (N) [a(y+k) ≠ ay+k]</text>

  <!-- Bottom Summary Note -->
  <text x="250" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">
    Applying these 3 rules allows us to immediately evaluate any transformation pair.
  </text>
</svg>