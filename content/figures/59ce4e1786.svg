<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>
  <rect width='300' height='300' fill='#ffffff' />
  
  <!-- Parallel Lines EF and GH -->
  <line x1='50' y1='50' x2='280' y2='50' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  <line x1='50' y1='250' x2='280' y2='250' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />

  <!-- Parallel markers -->
  <path d='M 260 50 L 255 45 M 260 50 L 255 55' fill='none' stroke='#64748b' stroke-width='1.5' />
  <path d='M 265 50 L 260 45 M 265 50 L 260 55' fill='none' stroke='#64748b' stroke-width='1.5' />
  <path d='M 260 250 L 255 245 M 260 250 L 255 255' fill='none' stroke='#64748b' stroke-width='1.5' />
  <path d='M 265 250 L 260 245 M 265 250 L 260 255' fill='none' stroke='#64748b' stroke-width='1.5' />

  <!-- Zigzag AK and KC -->
  <!-- A(150,50), K(233.9,150), C(163.9, 250) -->
  <line x1='150' y1='50' x2='233.9' y2='150' stroke='#3b82f6' stroke-width='1.5' stroke-linecap='round' />
  <line x1='233.9' y1='150' x2='163.9' y2='250' stroke='#3b82f6' stroke-width='1.5' stroke-linecap='round' />

  <!-- Angle KAE = 130 -->
  <!-- AE is 180 deg. AK is 310 deg (-50 deg). Sweep 180 to 310. -->
  <path d='M 130 50 A 20 20 0 0 1 162.85575219373078 65.32088886237956' fill='none' stroke='#f59e0b' stroke-width='1.5' />
  <text x='115' y='75' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#d97706'>130°</text>

  <!-- Angle KCG = 125 -->
  <!-- CG is 180 deg. CK is 55 deg. Sweep 180 to 55. -->
  <path d='M 143.9 250 A 20 20 0 0 0 175.37152872702092 233.61695911422015' fill='none' stroke='#10b981' stroke-width='1.5' />
  <text x='130' y='225' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#059669'>125°</text>

  <!-- Angle AKC = beta -->
  <!-- KA is 130 deg. KC is 235 deg. Sweep from 130 to 235. -->
  <path d='M 217.83030975783652 130.84888892202554 A 25 25 0 0 0 219.56058909122385 170.4788011072248' fill='none' stroke='#8b5cf6' stroke-width='1.5' />
  <text x='195' y='155' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' fill='#7c3aed'>β</text>

  <!-- Points -->
  <text x='60' y='40' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>E</text>
  <text x='150' y='40' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>A</text>
  <text x='240' y='40' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>F</text>
  
  <text x='60' y='270' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>G</text>
  <text x='163.9' y='270' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>C</text>
  <text x='240' y='270' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>H</text>
  
  <text x='245' y='155' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>K</text>
  
  <circle cx='150' cy='50' r='3' fill='#3b82f6' />
  <circle cx='233.9' cy='150' r='3' fill='#3b82f6' />
  <circle cx='163.9' cy='250' r='3' fill='#3b82f6' />
</svg>