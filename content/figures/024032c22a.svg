<svg width="440" height="320" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="440" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step Banner -->
  <rect x="16" y="10" width="408" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="220" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">
    Step 4: Conclusion — ΔPMR ≡ ΔPMS (RHS Congruence)
  </text>

  <!-- Left Triangle Shaded (ΔPMR) -->
  <polygon points="220,55 100,235 220,235" fill="rgba(59, 130, 246, 0.14)" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Right Triangle Shaded (ΔPMS) -->
  <polygon points="220,55 340,235 220,235" fill="rgba(16, 185, 129, 0.14)" stroke="#059669" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Shared Divider PM -->
  <line x1="220" y1="55" x2="220" y2="235" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- Right Angle Marks -->
  <path d="M 220 221 L 206 221 L 206 235" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 220 221 L 234 221 L 234 235" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>

  <!-- Ticks on Hypotenuses (midpoint 160, 145 & 280, 145) -->
  <line x1="153" y1="141" x2="167" y2="149" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="273" y1="149" x2="287" y2="141" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Triangle Badges -->
  <rect x="110" y="160" width="76" height="24" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="148" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">ΔPMR</text>

  <rect x="254" y="160" width="76" height="24" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1" filter="url(#shadow)"/>
  <text x="292" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">ΔPMS</text>

  <!-- Vertices -->
  <circle cx="220" cy="55" r="4.5" fill="#1e293b"/>
  <circle cx="100" cy="235" r="4.5" fill="#1e293b"/>
  <circle cx="340" cy="235" r="4.5" fill="#1e293b"/>
  <circle cx="220" cy="235" r="4.5" fill="#7c3aed"/>

  <!-- Labels -->
  <text x="220" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">P</text>
  <text x="84" y="248" text-anchor="end" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">R</text>
  <text x="356" y="248" text-anchor="start" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">S</text>
  <text x="220" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">M</text>

  <!-- Result Banner at bottom -->
  <rect x="20" y="265" width="400" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b45309">
    ∴ ΔPMR ≡ ΔPMS (RHS Congruence Test)
  </text>
  <text x="220" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">
    R: ∠PMR = ∠PMS = 90°  |  H: PR = PS (hypotenuse)  |  S: PM common
  </text>
</svg>