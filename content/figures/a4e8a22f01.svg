<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg"><defs><style>.set-label { font-size: 13px; font-weight: 700; fill: #1e293b; }.element-text { font-size: 12px; fill: #1e293b; font-weight: 600; }.element-circle { fill: #e0e7ff; stroke: #64748b; stroke-width: 2; }.element-circle-Q { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }.arrow { stroke: #6366f1; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }</style><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#6366f1"/></marker></defs><text x="350" y="25" class="set-label" text-anchor="middle" font-size="18">Domain P → Codomain Q</text><text x="80" y="65" class="set-label" text-anchor="middle">Domain P</text><circle cx="80" cy="110" r="20" class="element-circle"/><text x="80" y="115" class="element-text" text-anchor="middle">P₁</text><circle cx="80" cy="160" r="20" class="element-circle"/><text x="80" y="165" class="element-text" text-anchor="middle">P₂</text><circle cx="80" cy="210" r="20" class="element-circle"/><text x="80" y="215" class="element-text" text-anchor="middle">P₃</text><circle cx="80" cy="260" r="20" class="element-circle"/><text x="80" y="265" class="element-text" text-anchor="middle">P₄</text><circle cx="80" cy="310" r="20" class="element-circle"/><text x="80" y="315" class="element-text" text-anchor="middle">P₆</text><text x="620" y="65" class="set-label" text-anchor="middle">Codomain Q</text><circle cx="620" cy="110" r="20" class="element-circle-Q"/><text x="620" y="115" class="element-text" text-anchor="middle">Q₁</text><circle cx="620" cy="160" r="20" class="element-circle-Q"/><text x="620" y="165" class="element-text" text-anchor="middle">Q₂</text><circle cx="620" cy="210" r="20" class="element-circle-Q"/><text x="620" y="215" class="element-text" text-anchor="middle">Q₃</text><circle cx="620" cy="260" r="20" class="element-circle-Q"/><text x="620" y="265" class="element-text" text-anchor="m