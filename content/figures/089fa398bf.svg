<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#f8fafc" rx="8"/>
  <!-- North line from Tree -->
  <line x1="100" y1="170" x2="100" y2="30" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="25" font-family="sans-serif" font-size="13" fill="#64748b">N (000°)</text>
  <!-- East line -->
  <line x1="100" y1="170" x2="240" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="245" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8">E (090°)</text>
  <!-- First shot direction -->
  <line x1="100" y1="170" x2="230" y2="138" stroke="#2563eb" stroke-width="3"/>
  <!-- Bearing arc from N clockwise -->
  <path d="M 100 90 A 80 80 0 0 1 178 147" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="138" y="105" font-family="serif" font-size="14" fill="#ea580c" font-weight="bold">Bearing = 081°</text>
  <!-- Angle a from East line -->
  <path d="M 155 170 A 55 55 0 0 0 152 155" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="162" y="163" font-family="serif" font-size="13" fill="#8b5cf6">a = 9°</text>
  <!-- Formula -->
  <text x="150" y="195" text-anchor="middle" font-family="serif" font-size="13" fill="#0f172a">090° − 9° = 081°</text>
</svg>