<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" style="max-width:320px;display:block;margin:0 auto" role="img" aria-label="Graph of y = (x - 3)^2 showing vertex at (3, 0) and y-intercept at (0, 9)">
  <rect width="320" height="250" rx="10" fill="#fff"/>
  
  <!-- Grid lines (subtle) -->
  <line x1="25" y1="48.5" x2="295" y2="48.5" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="162.0" y1="30" x2="162.0" y2="235" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  
  <!-- Axes -->
  <line x1="25" y1="215" x2="295" y2="215" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="295,211.5 303,215 295,218.5" fill="#334155"/>
  <text x="306" y="219" font-size="12" font-weight="600" fill="#334155">x</text>

  <line x1="60" y1="235" x2="60" y2="22" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="56.5,22 60,14 63.5,22" fill="#334155"/>
  <text x="56" y="12" font-size="12" font-weight="600" fill="#334155" text-anchor="end">y</text>
  
  <!-- Origin -->
  <text x="54" y="229" font-size="11" fill="#64748b" text-anchor="end">O</text>

  <!-- Parabola curve -->
  <path d="M 53.2 25.6 L 56.6 37.2 L 60.0 48.5 L 63.4 59.4 L 66.8 70.0 L 70.2 80.1 L 73.6 89.9 L 77.0 99.4 L 80.4 108.4 L 83.8 117.1 L 87.2 125.5 L 90.6 133.4 L 94.0 141.0 L 97.4 148.2 L 100.8 155.1 L 104.2 161.5 L 107.6 167.6 L 111.0 173.4 L 114.4 178.7 L 117.8 183.7 L 121.2 188.4 L 124.6 192.6 L 128.0 196.5 L 131.4 200.0 L 134.8 203.2 L 138.2 205.9 L 141.6 208.3 L 145.0 210.4 L 148.4 212.0 L 151.8 213.3 L 155.2 214.3 L 158.6 214.8 L 162.0 215.0 L 165.4 214.8 L 168.8 214.3 L 172.2 213.3 L 175.6 212.0 L 179.0 210.4 L 182.4 208.3 L 185.8 205.9 L 189.2 203.2 L 192.6 200.0 L 196.0 196.5 L 199.4 192.6 L 202.8 188.4 L 206.2 183.7 L 209.6 178.7 L 213.0 173.4 L 216.4 167.6 L 219.8 161.5 L 223.2 155.1 L 226.6 148.2 L 230.0 141.0 L 233.4 133.4 L 236.8 125.5 L 240.2 117.1 L 243.6 108.4 L 247.0 99.4 L 250.4 89.9 L 253.8 80.1 L 257.2 70.0 L 260.6 59.4 L 264.0 48.5 L 267.4 37.2 L 270.8 25.6" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Curve Equation label -->
  <rect x="180" y="32" width="105" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="232" y="47" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">y = (x - 3)²</text>

  <!-- y-intercept (0, 9) -->
  <circle cx="60.0" cy="48.5" r="4.5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="52.0" y="52.5" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">(0, 9)</text>

  <!-- Vertex / x-intercept (3, 0) -->
  <circle cx="162.0" cy="215.0" r="4.5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="162.0" y="231.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">(3, 0)</text>

  <!-- Axis of symmetry label -->
  <text x="162.0" y="244" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">axis: x = 3</text>
</svg>