<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#f8fafc" rx="8"/>
  <!-- North line (faded) -->
  <line x1="150" y1="200" x2="150" y2="30" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="155" y="25" font-family="sans-serif" font-size="13" fill="#cbd5e1">N</text>
  <!-- Right angle at top corner -->
  <rect x="100" y="55" width="12" height="12" fill="none" stroke="#475569" stroke-width="1.5"/>
  <!-- West leg: top corner to end (horizontal) -->
  <line x1="100" y1="55" x2="150" y2="55" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- North leg: HIGHLIGHTED (adj = ? North distance) -->
  <line x1="150" y1="200" x2="150" y2="55" stroke="#16a34a" stroke-width="4"/>
  <rect x="155" y="115" width="75" height="20" rx="4" fill="#dcfce7"/>
  <text x="160" y="130" font-family="serif" font-size="12" fill="#16a34a" font-weight="bold">Adj = ? (N dist)</text>
  <!-- Hyp: flight path HIGHLIGHTED -->
  <line x1="150" y1="200" x2="100" y2="55" stroke="#2563eb" stroke-width="4"/>
  <rect x="45" y="120" width="60" height="20" rx="4" fill="#dbeafe"/>
  <text x="50" y="135" font-family="serif" font-size="12" fill="#2563eb" font-weight="bold">Hyp = 16</text>
  <!-- Angle 20 deg HIGHLIGHTED -->
  <path d="M 150 168 A 32 32 0 0 0 140 165" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <text x="112" y="178" font-family="serif" font-size="14" fill="#e11d48" font-weight="bold">20°</text>
  <text x="55" y="220" font-family="sans-serif" font-size="11" fill="#475569">360° - 340° = 20° (from N, West of N)</text>
</svg>