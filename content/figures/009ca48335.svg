<svg viewBox="0 0 420 120" width="100%" height="auto" style="max-width:440px;display:block;margin:1rem auto;background-color:#f8fafc;border-radius:16px;border:1px solid #e2e8f0;padding:0.5rem;" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="48" width="116" height="44" rx="22" ry="22" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="58" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="central">y = 5x − 3</text><line x1="120" y1="70" x2="148" y2="70" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/><polygon points="148,70 138,75 138,65" fill="#3b82f6"/><text x="134" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle" dominant-baseline="central">+ 3</text><rect x="152" y="48" width="116" height="44" rx="22" ry="22" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="210" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="central">y + 3 = 5x</text><line x1="272" y1="70" x2="300" y2="70" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/><polygon points="300,70 290,75 290,65" fill="#3b82f6"/><text x="286" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle" dominant-baseline="central">÷ 5</text><rect x="304" y="48" width="116" height="44" rx="22" ry="22" fill="#bbf7d0" stroke="#475569" stroke-width="1.5"/><text x="362" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="central">x = (y+3)/5</text><text x="210" y="18" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle" dominant-baseline="central">Rearranging the formula</text></svg>