<svg width="260" height="120" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120">
  <rect width="260" height="120" fill="#fffbeb" rx="8"/>
  <text x="130" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#92400e" font-weight="bold">Applying cos ratio (Adj/Hyp):</text>
  <text x="130" y="60" text-anchor="middle" font-family="serif" font-size="16" fill="#1d4ed8">cos 20° = North distance / 16</text>
  <line x1="30" y1="75" x2="230" y2="75" stroke="#d1d5db" stroke-width="1"/>
  <text x="130" y="100" text-anchor="middle" font-family="serif" font-size="15" fill="#059669" font-weight="bold">= 16 × cos 20° ≈ 15 km</text>
</svg>