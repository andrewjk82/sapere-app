<svg width="440" height="320" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="440" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step Banner -->
  <rect x="16" y="12" width="408" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="220" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">
    Step 2: Equal Hypotenuses (H in RHS) — PR = PS
  </text>

  <!-- Triangle with highlighted hypotenuses -->
  <polygon points="220,60 100,250 340,250" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="220" y1="60" x2="220" y2="250" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Right angle marks -->
  <path d="M 220 236 L 206 236 L 206 250" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <path d="M 220 236 L 234 236 L 234 250" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>

  <!-- Bold Hypotenuses PR and PS -->
  <line x1="220" y1="60" x2="100" y2="250" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="220" y1="60" x2="340" y2="250" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Ticks -->
  <line x1="153" y1="151" x2="167" y2="159" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="273" y1="159" x2="287" y2="151" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

  <!-- Vertices -->
  <circle cx="220" cy="60" r="4.5" fill="#059669"/>
  <circle cx="100" cy="250" r="4.5" fill="#059669"/>
  <circle cx="340" cy="250" r="4.5" fill="#059669"/>
  <circle cx="220" cy="250" r="4" fill="#64748b"/>

  <!-- Labels -->
  <text x="220" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">P</text>
  <text x="84" y="266" text-anchor="end" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">R</text>
  <text x="356" y="266" text-anchor="start" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">S</text>
  <text x="220" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">M</text>

  <!-- Hypotenuse Badges -->
  <rect x="50" y="110" width="105" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="102" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Hypotenuse PR</text>
  <text x="102" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">(Opposite 90°)</text>

  <rect x="285" y="110" width="105" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="337" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Hypotenuse PS</text>
  <text x="337" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">(Opposite 90°)</text>

  <!-- Condition Summary -->
  <rect x="110" y="280" width="220" height="28" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" filter="url(#shadow)"/>
  <text x="220" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">
    Condition 2 (H): PR = PS (Given)
  </text>
</svg>