<svg viewBox="0 0 340 300" width="340" height="300" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:2rem auto;background-color:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;">
  <!-- North Arrow at B -->
  <line x1="120" y1="40" x2="120" y2="15" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="116,25 124,25 120,15" fill="#64748b"/>
  <text x="120" y="10" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b" stroke="#f8fafc" stroke-width="3" paint-order="stroke">N</text>

  <!-- Triangle Sides -->
  <line x1="120" y1="240" x2="120" y2="40" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="120" y1="240" x2="235" y2="240" stroke="#475569" stroke-width="2.2" stroke-dasharray="5 3"/>
  <line x1="120" y1="40" x2="235" y2="240" stroke="#475569" stroke-width="2.2" stroke-dasharray="5 3"/>

  <!-- Right angle at A -->
  <polyline points="120,225 135,225 135,240" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Angle arc at B (150°T) -->
  <path d="M 120 10 A 30 30 0 0 1 135 66" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="145" y="35" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#b45309" stroke="#f8fafc" stroke-width="3" paint-order="stroke">150°T</text>

  <!-- Points -->
  <circle cx="120" cy="240" r="4" fill="#1e293b"/>
  <circle cx="120" cy="40" r="4" fill="#1e293b"/>
  <circle cx="235" cy="240" r="4" fill="#1e293b"/>

  <!-- Labels -->
  <text x="110" y="255" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#1e293b" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Start (9pm)</text>
  <text x="110" y="45" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#1e293b" stroke="#f8fafc" stroke-width="3" paint-order="stroke">9:45pm</text>
  <text x="245" y="245" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1e293b" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Light</text>

  <!-- Distance Label -->
  <text x="110" y="140" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#dc2626" stroke="#f8fafc" stroke-width="3" paint-order="stroke">120 km</text>
</svg>