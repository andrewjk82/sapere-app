<svg viewBox="0 0 340 300" width="340" height="300" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0.5rem auto;background-color:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;">
<line x1="20" y1="250" x2="320" y2="250" stroke="#94a3b8" stroke-width="2"/>
<polygon points="320,246 328,250 320,254" fill="#94a3b8"/>
<text x="315" y="292" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#64748b">Time (t)</text>

<line x1="60" y1="250" x2="60" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
<circle cx="60" cy="250" r="4" fill="#1e293b"/>
<text x="60" y="270" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#1e293b">t₀ - 3 hours</text>

<line x1="280" y1="250" x2="280" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
<circle cx="280" cy="250" r="4" fill="#1e293b"/>
<text x="280" y="270" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#1e293b">t₀ (Sched. finish)</text>

<text x="15" y="45" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#c026d3">Wife's Timeline</text>
<line x1="60" y1="65" x2="190" y2="65" stroke="#c026d3" stroke-width="2.5"/>
<circle cx="60" cy="65" r="4" fill="#c026d3"/>
<circle cx="190" cy="65" r="5" fill="#dc2626"/>
<text x="125" y="57" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#c026d3">Walks (D-9) km</text>

<line x1="190" y1="65" x2="190" y2="250" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="190" y="240" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#dc2626">Meet!</text>

<text x="15" y="103" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#2563eb">Husband's Timeline</text>
<line x1="120" y1="130" x2="190" y2="130" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="120" cy="130" r="4" fill="#2563eb"/>
<circle cx="190" cy="130" r="5" fill="#dc2626"/>
<text x="155" y="122" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#2563eb">Driving to meet</text>

<line x1="190" y1="130" x2="280" y2="130" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="280" cy="130" r="4" fill="#94a3b8"/>
<text x="280" y="122" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b">Sched. arr at Uni</text>
<text x="235" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#16a34a">Saved drive (D-9) km</text>
</svg>