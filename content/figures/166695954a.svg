<svg width="320" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="160" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Cross Method: x² − 5x + 6</text>

  <!-- Cross lines -->
  <line x1="160" y1="40" x2="160" y2="215" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="128" x2="260" y2="128" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Diagonal arrows (cross multiply) -->
  <line x1="90" y1="80" x2="230" y2="175" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="230" y1="80" x2="90" y2="175" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Quadrant labels -->
  <!-- Top-left: x -->
  <rect x="65" y="48" width="80" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-family="serif" font-style="italic" font-size="28" fill="#1d4ed8">x</text>

  <!-- Top-right: -2 -->
  <rect x="170" y="48" width="80" height="68" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="210" y="90" text-anchor="middle" font-family="serif" font-size="26" fill="#b45309">−2</text>

  <!-- Bottom-left: x -->
  <rect x="65" y="135" width="80" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="177" text-anchor="middle" font-family="serif" font-style="italic" font-size="28" fill="#1d4ed8">x</text>

  <!-- Bottom-right: -3 -->
  <rect x="170" y="135" width="80" height="68" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="210" y="177" text-anchor="middle" font-family="serif" font-size="26" fill="#b45309">−3</text>

  <!-- Diagonal product labels -->
  <text x="175" y="118" font-family="serif" font-size="12" fill="#f97316">x × (−3) = −3x</text>
  <text x="45" y="118" font-family="serif" font-size="12" fill="#8b5cf6">x × (−2) = −2x</text>

  <!-- Sum line -->
  <line x1="50" y1="225" x2="270" y2="225" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="245" text-anchor="middle" font-family="serif" font-size="14" fill="#065f46">Sum: −3x + (−2x) = −5x ✓</text>
</svg>