<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg"><defs><style>.axis { stroke: #1e293b; stroke-width: 2; }.grid { stroke: #e2e8f0; stroke-width: 1; }.axis-label { font-size: 12px; fill: #64748b; font-weight: 600; }.tick-label { font-size: 10px; fill: #64748b; }.curve { stroke: #6366f1; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }.max-point { fill: #ef4444; r: 5; }.max-label { font-size: 12px; fill: #ef4444; font-weight: 700; }.tangent-line { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4; }.annotation { font-size: 11px; fill: #64748b; }</style></defs><rect width="500" height="350" fill="#ffffff"/><text x="250" y="20" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Velocity vs Time Graph</text><line x1="50" y1="300" x2="450" y2="300" class="axis"/><line x1="50" y1="300" x2="50" y2="40" class="axis"/><text x="460" y="305" class="axis-label">t (s)</text><text x="30" y="35" class="axis-label">v (m/s)</text><line x1="50" y1="300" x2="45" y2="300"/><text x="40" y="305" class="tick-label">0</text><line x1="100" y1="300" x2="95" y2="300"/><text x="90" y="305" class="tick-label">2</text><line x1="150" y1="300" x2="145" y2="300"/><text x="140" y="305" class="tick-label">4</text><line x1="200" y1="300" x2="195" y2="300"/><text x="190" y="305" class="tick-label">6</text><line x1="250" y1="300" x2="245" y2="300"/><text x="240" y="305" class="tick-label">8</text><line x1="300" y1="300" x2="295" y2="300"/><text x="290" y="305" class="tick-label">10</text><line x1="350" y1="300" x2="345" y2="300"/><text x="340" y="305" class="tick-label">12</text><line x1="400" y1="300" x2="395" y2="300"/><text x="390" y="305" class="tick-label">14</text><line x1="450" y1="300" x2="445" y2="300"/><text x="440" y="305" class="tick-label">16</text><line x1="50" y1="280" x2="450" y2="280" class="grid"/><line x1="50" y1="260" x2="450" y2="260" class="grid"/><line x1="50" y1="240" x2="450" y2="240" class="grid"/><line x1="50" y1="2