<svg width="480" height="340" viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="480" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Sub-heading banner -->
  <rect x="16" y="14" width="448" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="240" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Step 1: Base Curve y = −3x³ &amp; Inflection Point (0, 0)</text>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3">
    <line x1="90" y1="50" x2="90" y2="310"/>
    <line x1="155" y1="50" x2="155" y2="310"/>
    <line x1="285" y1="50" x2="285" y2="310"/>
    <line x1="350" y1="50" x2="350" y2="310"/>
    <line x1="30" y1="173" x2="450" y2="173"/>
    <line x1="30" y1="287" x2="450" y2="287"/>
  </g>

  <!-- Axes -->
  <line x1="30" y1="230" x2="450" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="220" y1="315" x2="220" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="456" y="234" font-family="serif" font-size="13" font-weight="bold" fill="#475569">x</text>
  <text x="220" y="44" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#475569">y</text>

  <!-- Ticks on x-axis -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="90" y1="226" x2="90" y2="234"/><text x="90" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">-2</text>
    <line x1="155" y1="226" x2="155" y2="234"/><text x="155" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">-1</text>
    <line x1="285" y1="226" x2="285" y2="234"/><text x="285" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">1</text>
    <line x1="350" y1="226" x2="350" y2="234"/><text x="350" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">2</text>
  </g>

  <!-- Ticks on y-axis -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="216" y1="173" x2="224" y2="173"/><text x="210" y="177" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">3</text>
    <line x1="216" y1="287" x2="224" y2="287"/><text x="210" y="291" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">-3</text>
  </g>

  <!-- Curve y = -3x^3 -->
  <polyline points="122.5,37.6 124.5,48.9 126.4,59.8 128.4,70.2 130.3,80.2 132.3,89.8 134.2,98.9 136.2,107.6 138.1,116.0 140.1,123.9 142.0,131.5 144.0,138.7 145.9,145.6 147.9,152.0 149.8,158.2 151.8,164.0 153.7,169.5 155.7,174.7 157.6,179.6 159.6,184.2 161.5,188.4 163.5,192.5 165.4,196.2 167.4,199.7 169.3,203.0 171.3,206.0 173.2,208.7 175.2,211.3 177.1,213.6 179.1,215.7 181.0,217.7 183.0,219.4 184.9,221.0 186.9,222.4 188.8,223.7 190.8,224.8 192.7,225.8 194.7,226.6 196.6,227.3 198.6,228.0 200.5,228.5 202.5,228.9 204.4,229.2 206.4,229.5 208.3,229.7 210.3,229.8 212.2,229.9 214.2,230.0 216.1,230.0 218.1,230.0 220.0,230.0 222.0,230.0 223.9,230.0 225.9,230.0 227.8,230.1 229.8,230.2 231.7,230.3 233.7,230.5 235.6,230.8 237.6,231.1 239.5,231.5 241.5,232.0 243.4,232.7 245.4,233.4 247.3,234.2 249.3,235.2 251.2,236.3 253.2,237.6 255.1,239.0 257.1,240.6 259.0,242.3 261.0,244.3 262.9,246.4 264.9,248.7 266.8,251.3 268.8,254.0 270.7,257.0 272.7,260.3 274.6,263.8 276.6,267.5 278.5,271.6 280.5,275.8 282.4,280.4 284.4,285.3 286.3,290.5 288.3,296.0 290.2,301.8 292.2,308.0 294.1,314.4 296.1,321.3 298.0,328.5" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <rect x="70" y="60" width="85" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="112" y="75" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#1d4ed8">y = −3x³</text>

  <!-- Horizontal Tangent at (0, 0) -->
  <line x1="175" y1="230" x2="265" y2="230" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="220" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#b45309">Horizontal tangent: y′(0) = 0</text>

  <!-- Inflection Point (0,0) -->
  <circle cx="220" cy="230" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <rect x="232" y="238" width="138" height="20" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="301" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">Inflection point: (0, 0)</text>

  <!-- Reference Points -->
  <circle cx="155" cy="173" r="4" fill="#2563eb"/>
  <text x="145" y="165" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#1e40af">(−1, 3)</text>

  <circle cx="285" cy="287" r="4" fill="#2563eb"/>
  <text x="295" y="295" text-anchor="start" font-family="sans-serif" font-size="10" font-weight="600" fill="#1e40af">(1, −3)</text>

  <!-- Concavity callouts -->
  <rect x="30" y="115" width="130" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="95" y="129" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#475569">x &lt; 0: Concave Up</text>
  <text x="95" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">y″ = −18x &gt; 0</text>

  <rect x="320" y="115" width="135" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="387" y="129" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#475569">x &gt; 0: Concave Down</text>
  <text x="387" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">y″ = −18x &lt; 0</text>
</svg>