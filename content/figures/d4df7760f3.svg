<svg viewBox="0 0 300 250" width="300" height="250" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:2rem auto;background-color:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;">
  <!-- AD -->
  <line x1="20" y1="40" x2="80" y2="200" stroke="#475569" stroke-width="2"/>
  <!-- BC -->
  <line x1="280" y1="40" x2="220" y2="200" stroke="#475569" stroke-width="2"/>
  
  <!-- Parallel Lines AB, PQ, DC -->
  <line x1="20" y1="40" x2="280" y2="40" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="50" y1="120" x2="250" y2="120" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="80" y1="200" x2="220" y2="200" stroke="#16a34a" stroke-width="2.5"/>

  <!-- Parallel Arrows -->
  <polygon points="146,36 156,40 146,44" fill="#dc2626"/>
  <polygon points="146,116 156,120 146,124" fill="#2563eb"/>
  <polygon points="146,196 156,200 146,204" fill="#16a34a"/>

  <!-- AP=PD Ticks -->
  <path d="M 25 78 L 41 72 M 29 88 L 45 82 M 55 158 L 71 152 M 59 168 L 75 162" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- BQ=QC Ticks -->
  <path d="M 257 77 L 273 83 M 227 157 L 243 163" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Points -->
  <circle cx="20" cy="40" r="4" fill="#1e293b"/>
  <circle cx="280" cy="40" r="4" fill="#1e293b"/>
  <circle cx="220" cy="200" r="4" fill="#1e293b"/>
  <circle cx="80" cy="200" r="4" fill="#1e293b"/>
  <circle cx="50" cy="120" r="4" fill="#1e293b"/>
  <circle cx="250" cy="120" r="4" fill="#1e293b"/>

  <!-- Vertex Labels -->
  <text x="15" y="30" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">A</text>
  <text x="285" y="30" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">B</text>
  <text x="225" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">C</text>
  <text x="75" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">D</text>
  <text x="35" y="125" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">P</text>
  <text x="265" y="125" text-anchor="start" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1e293b">Q</text>

  <!-- Side Length Labels -->
  <text x="150" y="25" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#dc2626">2x - 7</text>
  <text x="150" y="110" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#2563eb">x + 1</text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#16a34a">x - 3</text>
</svg>