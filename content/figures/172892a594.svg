<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -50 240 280" width="240" height="280">
  <!-- Dimension line for Width (w) -->
  <line x1="0" y1="-20" x2="120" y2="-20" stroke="#555" stroke-width="1.5"/>
  <line x1="0" y1="-25" x2="0" y2="-15" stroke="#555" stroke-width="1.5"/>
  <line x1="120" y1="-25" x2="120" y2="-15" stroke="#555" stroke-width="1.5"/>
  <text x="60" y="-30" font-family="serif" font-style="italic" font-size="22" fill="#333" text-anchor="middle">w</text>

  <!-- Dimension line for Height (h) -->
  <line x1="-20" y1="0" x2="-20" y2="180" stroke="#555" stroke-width="1.5"/>
  <line x1="-25" y1="0" x2="-15" y2="0" stroke="#555" stroke-width="1.5"/>
  <line x1="-25" y1="180" x2="-15" y2="180" stroke="#555" stroke-width="1.5"/>
  <text x="-35" y="96" font-family="serif" font-style="italic" font-size="22" fill="#333" text-anchor="end">h</text>
  
  <!-- Glass panes -->
  <rect x="0" y="0" width="60" height="60" fill="#d6eaf8" stroke="none"/>
  <rect x="60" y="0" width="60" height="60" fill="#d6eaf8" stroke="none"/>
  <rect x="0" y="60" width="60" height="60" fill="#d6eaf8" stroke="none"/>
  <rect x="60" y="60" width="60" height="60" fill="#d6eaf8" stroke="none"/>
  <rect x="0" y="120" width="60" height="60" fill="#d6eaf8" stroke="none"/>
  <rect x="60" y="120" width="60" height="60" fill="#d6eaf8" stroke="none"/>

  <!-- Vertical rails (3 of them) -->
  <line x1="0" y1="0" x2="0" y2="180" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  <line x1="60" y1="0" x2="60" y2="180" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  <line x1="120" y1="0" x2="120" y2="180" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  
  <!-- Horizontal rails (4 of them) -->
  <line x1="0" y1="0" x2="120" y2="0" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  <line x1="0" y1="60" x2="120" y2="60" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  <line x1="0" y1="120" x2="120" y2="120" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
  <line x1="0" y1="180" x2="120" y2="180" stroke="#2c3e50" stroke-width="4" stroke-linecap="square"/>
</svg>