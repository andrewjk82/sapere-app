<svg width="340" height="80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <rect width="340" height="80" fill="#f8fafc" rx="8"/>
  <text x="170" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569" font-weight="bold">Identify the transformation</text>
  <!-- Original -->
  <rect x="10" y="30" width="150" height="38" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="47" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8">y = −3x³</text>
  <text x="85" y="63" text-anchor="middle" font-family="serif" font-size="11" fill="#3b82f6">Inflection: (0, 0)</text>
  <!-- Arrow -->
  <text x="170" y="54" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#64748b">→</text>
  <!-- New -->
  <rect x="185" y="30" width="145" height="38" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="257" y="47" text-anchor="middle" font-family="serif" font-size="13" fill="#b45309">y = −3(x−4)³ − 1</text>
  <text x="257" y="63" text-anchor="middle" font-family="serif" font-size="11" fill="#b45309">New inflection: (4, −1)</text>
</svg>