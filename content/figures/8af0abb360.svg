<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260" width="260" height="260">
  <!-- Full circle outline -->
  <circle cx="0" cy="0" r="100" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- Shaded region: sector OAB (central angle 45 deg) -->
  <!-- A=(100,0) B=(70.7,70.7) C=(0,100) D=(-70.7,70.7) E=(-100,0) -->
  <!-- Sector OAB -->
  <path d="M 0,0 L 100,0 A 100,100 0 0,1 70.7,-70.7 Z" fill="#4a90d9" fill-opacity="0.45" stroke="#2260a8" stroke-width="1.5"/>
  <!-- Triangle OBC -->
  <polygon points="0,0 70.7,-70.7 0,-100" fill="#4a90d9" fill-opacity="0.45" stroke="#2260a8" stroke-width="1.5"/>
  <!-- Triangle OCD -->
  <polygon points="0,0 0,-100 -70.7,-70.7" fill="#4a90d9" fill-opacity="0.45" stroke="#2260a8" stroke-width="1.5"/>
  <!-- Triangle ODE -->
  <polygon points="0,0 -70.7,-70.7 -100,0" fill="#4a90d9" fill-opacity="0.45" stroke="#2260a8" stroke-width="1.5"/>
  
  <!-- Removed segments shown as white with dashed chord -->
  <!-- Segment BC chord -->
  <line x1="70.7" y1="-70.7" x2="0" y2="-100" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Segment CD chord -->
  <line x1="0" y1="-100" x2="-70.7" y2="-70.7" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Segment DE chord -->
  <line x1="-70.7" y1="-70.7" x2="-100" y2="0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Radii lines -->
  <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="70.7" y2="-70.7" stroke="#333" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="-70.7" y2="-70.7" stroke="#333" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="-100" y2="0" stroke="#333" stroke-width="1.5"/>
  
  <!-- Theta angle arc at centre -->
  <path d="M 20,0 A 20,20 0 0,0 14.1,-14.1" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="22" y="-8" font-size="13" font-style="italic" fill="#333" font-family="serif">&#x3B8;</text>
  
  <!-- Point labels -->
  <text x="105" y="5" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">A</text>
  <text x="73" y="-76" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">B</text>
  <text x="3" y="-105" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">C</text>
  <text x="-88" y="-76" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">D</text>
  <text x="-118" y="5" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">E</text>
  <text x="3" y="12" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">O</text>
  
  <!-- Radius label -->
  <text x="46" y="-12" font-size="11" fill="#555" font-family="sans-serif">10 cm</text>
</svg>