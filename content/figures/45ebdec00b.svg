<svg viewBox="0 0 200 120" width="300" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid -->
  <line x1="20" y1="90" x2="180" y2="90" stroke="#ccc" stroke-width="1"/>
  <line x1="120" y1="10" x2="120" y2="110" stroke="#ccc" stroke-width="1"/>
  <text x="185" y="94" font-size="10" font-family="serif">x</text>
  <text x="120" y="8" font-size="10" font-family="serif" text-anchor="middle">y</text>
  
  <line x1="45" y1="87" x2="45" y2="93" stroke="black" stroke-width="1"/>
  <text x="45" y="105" font-size="10" font-family="serif" text-anchor="middle">-10</text>
  
  <line x1="82.5" y1="87" x2="82.5" y2="93" stroke="black" stroke-width="1"/>
  <text x="82.5" y="105" font-size="10" font-family="serif" text-anchor="middle">-5</text>
  
  <line x1="117" y1="52.5" x2="123" y2="52.5" stroke="black" stroke-width="1"/>
  <text x="110" y="56" font-size="10" font-family="serif" text-anchor="end">5</text>
  
  <line x1="117" y1="15" x2="123" y2="15" stroke="black" stroke-width="1"/>
  <text x="110" y="19" font-size="10" font-family="serif" text-anchor="end">10</text>
  
  <!-- Graph y = |2x + 6|. At x=0, y=6. At x=-3, y=0. At x=-10, y=14. -->
  <!-- Origin is (120, 90). scale is 7.5 px per unit. -->
  <polyline points="45,15 97.5,90 150,15" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="45,15 48,22 42,22" fill="black"/>
  <polygon points="150,15 147,22 153,22" fill="black"/>
</svg>