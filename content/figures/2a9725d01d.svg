<svg viewBox="0 0 360 120" width="100%" height="auto" style="max-width:440px;display:block;margin:1rem auto;background-color:#f8fafc;border-radius:16px;border:1px solid #e2e8f0;padding:0.5rem;" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="60" x2="320" y2="60" stroke="#475569" stroke-width="2" stroke-linecap="round"/><circle cx="80" cy="60" r="6" fill="#3b82f6"/><circle cx="280" cy="60" r="6" fill="#3b82f6"/><circle cx="180" cy="60" r="7" fill="#10b981"/><text x="80" y="85" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle" dominant-baseline="central">n</text><text x="280" y="85" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle" dominant-baseline="central">m</text><text x="180" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle" dominant-baseline="central">a = (m+n)/2</text></svg>