<svg width="340" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200">
  <rect width="340" height="200" fill="#f0f9ff" rx="8"/>
  
  <line x1="0" y1="160" x2="340" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="0" x2="70" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="332" y="154" font-family="sans-serif" font-size="11" fill="#94a3b8">x</text>
  <text x="75" y="12" font-family="sans-serif" font-size="11" fill="#94a3b8">y</text>
  
  <!-- original -->
  <path d="M 4 160 A 66 66 0 0 1 136 160" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="55" y="84" font-family="sans-serif" font-size="11" fill="#64748b">y = g(x)</text>
  <circle cx="70" cy="160" r="3" fill="#94a3b8"/>
  
  <!-- translated RIGHT by 5 -->
  <path d="M 114 160 A 66 66 0 0 1 246 160" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="170" y="84" font-family="sans-serif" font-size="11" fill="#ea580c">y = g(x−5)</text>
  
  <!-- new center -->
  <circle cx="180" cy="160" r="4" fill="#ea580c"/>
  <text x="165" y="175" font-family="serif" font-size="12" fill="#9a3412" font-weight="bold">(5, 0)</text>
</svg>