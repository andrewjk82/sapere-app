<svg width="320" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210">
  <!-- Snow mountain background hint -->
  <rect width="320" height="210" fill="#f0f7ff" rx="8"/>

  <!-- Horizontal reference line at top (dashed) -->
  <line x1="40" y1="50" x2="290" y2="50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="295" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">horizontal</text>

  <!-- Triangle: A(top-left), C(top-right same height as A), B(bottom-right) -->
  <!-- A = summit (40,50), B = base (250,170), C = foot of vertical (250,50) -->
  <!-- Slope: A to B -->
  <line x1="40" y1="50" x2="250" y2="170" stroke="#64748b" stroke-width="2.5"/>
  <!-- Vertical drop: C to B -->
  <line x1="250" y1="50" x2="250" y2="170" stroke="#64748b" stroke-width="2"/>
  <!-- Horizontal from A to C (base of angle) -->
  <line x1="40" y1="50" x2="250" y2="50" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Right angle at B -->
  <rect x="238" y="158" width="12" height="12" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Angle of depression arc at A -->
  <path d="M 90,50 A 50,50 0 0 1 75,76" fill="none" stroke="#e11d48" stroke-width="2"/>
  <text x="95" y="70" font-family="serif" font-size="16" fill="#e11d48" font-style="italic">θ</text>
  <text x="70" y="90" font-family="sans-serif" font-size="10" fill="#e11d48">(angle of depression)</text>

  <!-- Labels -->
  <circle cx="40" cy="50" r="4" fill="#1d4ed8"/>
  <text x="22" y="46" font-family="sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">A</text>
  <circle cx="250" cy="170" r="4" fill="#1d4ed8"/>
  <text x="256" y="178" font-family="sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">B</text>
  <circle cx="250" cy="50" r="3" fill="#94a3b8"/>
  <text x="256" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">C</text>

  <!-- Side labels -->
  <text x="120" y="128" font-family="serif" font-size="14" fill="#374151" transform="rotate(30, 145, 110)">415 m (slope)</text>
  <text x="258" y="115" font-family="serif" font-size="13" fill="#374151">115 m</text>
  <text x="258" y="128" font-family="serif" font-size="11" fill="#64748b">(vertical drop)</text>
</svg>