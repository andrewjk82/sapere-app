<svg viewBox="0 0 150 100" width="200" height="133" xmlns="http://www.w3.org/2000/svg">
  <!-- Rhombus with diagonals -->
  <polygon points="75,10 135,50 75,90 15,50" fill="none" stroke="black" stroke-width="2"/>
  <line x1="15" y1="50" x2="135" y2="50" stroke="black" stroke-width="1"/>
  <line x1="75" y1="10" x2="75" y2="90" stroke="black" stroke-width="1"/>
  
  <!-- Right angle -->
  <polyline points="75,45 80,45 80,50" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Hash marks -->
  <!-- horizontal diagonal -->
  <line x1="43" y1="47" x2="47" y2="53" stroke="black" stroke-width="1.5"/>
  <line x1="47" y1="47" x2="51" y2="53" stroke="black" stroke-width="1.5"/>
  <line x1="103" y1="47" x2="107" y2="53" stroke="black" stroke-width="1.5"/>
  <line x1="107" y1="47" x2="111" y2="53" stroke="black" stroke-width="1.5"/>
  
  <!-- vertical diagonal -->
  <line x1="72" y1="28" x2="78" y2="32" stroke="black" stroke-width="1.5"/>
  <line x1="72" y1="68" x2="78" y2="72" stroke="black" stroke-width="1.5"/>
</svg>