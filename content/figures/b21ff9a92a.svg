<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 200' width='520' height='200' font-family='sans-serif'>
  <!-- Background -->
  <rect width='520' height='200' fill='#f8fafc' rx='10'/>

  <!-- ===== Figure U: 4×2 horizontal rectangle ===== -->
  <rect x='30' y='50' width='120' height='60' fill='#eff6ff' stroke='#2563eb' stroke-width='2.5' rx='2'/>
  <!-- diagonal: top-left to bottom-right -->
  <line x1='30' y1='50' x2='150' y2='110' stroke='#2563eb' stroke-width='2' stroke-dasharray='5,3'/>
  <!-- width label -->
  <line x1='30' y1='125' x2='150' y2='125' stroke='#2563eb' stroke-width='1.5' marker-start='url(#arrowBlue)' marker-end='url(#arrowBlue)'/>
  <text x='90' y='140' text-anchor='middle' fill='#2563eb' font-size='13' font-weight='bold'>4 cm</text>
  <!-- height label -->
  <line x1='15' y1='50' x2='15' y2='110' stroke='#2563eb' stroke-width='1.5'/>
  <text x='10' y='84' text-anchor='middle' fill='#2563eb' font-size='13' font-weight='bold' transform='rotate(-90,10,84)'>2 cm</text>
  <!-- Figure label -->
  <text x='90' y='158' text-anchor='middle' fill='#1e40af' font-size='14' font-weight='bold'>Figure U</text>
  <!-- Right angle marker -->
  <rect x='140' y='50' width='10' height='10' fill='none' stroke='#2563eb' stroke-width='1.5'/>

  <!-- ===== Figure V: 2×4 vertical rectangle ===== -->
  <rect x='210' y='20' width='60' height='120' fill='#f0fdf4' stroke='#16a34a' stroke-width='2.5' rx='2'/>
  <!-- diagonal: top-left to bottom-right -->
  <line x1='210' y1='20' x2='270' y2='140' stroke='#16a34a' stroke-width='2' stroke-dasharray='5,3'/>
  <!-- width label -->
  <line x1='210' y1='155' x2='270' y2='155' stroke='#16a34a' stroke-width='1.5'/>
  <text x='240' y='170' text-anchor='middle' fill='#16a34a' font-size='13' font-weight='bold'>2 cm</text>
  <!-- height label -->
  <line x1='195' y1='20' x2='195' y2='140' stroke='#16a34a' stroke-width='1.5'/>
  <text x='190' y='84' text-anchor='middle' fill='#16a34a' font-size='13' font-weight='bold' transform='rotate(-90,190,80)'>4 cm</text>
  <!-- Figure label -->
  <text x='240' y='188' text-anchor='middle' fill='#15803d' font-size='14' font-weight='bold'>Figure V</text>
  <!-- Congruent badge -->
  <text x='240' y='14' text-anchor='middle' fill='#15803d' font-size='12' font-weight='bold'>✓ same sides</text>
  <!-- Right angle marker -->
  <rect x='260' y='20' width='10' height='10' fill='none' stroke='#16a34a' stroke-width='1.5'/>

  <!-- ===== Figure W: 5×2.5 rectangle ===== -->
  <rect x='350' y='55' width='140' height='70' fill='#fff1f2' stroke='#dc2626' stroke-width='2.5' rx='2'/>
  <!-- diagonal: top-left to bottom-right -->
  <line x1='350' y1='55' x2='490' y2='125' stroke='#dc2626' stroke-width='2' stroke-dasharray='5,3'/>
  <!-- width label -->
  <line x1='350' y1='140' x2='490' y2='140' stroke='#dc2626' stroke-width='1.5'/>
  <text x='420' y='155' text-anchor='middle' fill='#dc2626' font-size='13' font-weight='bold'>5 cm</text>
  <!-- height label -->
  <line x1='335' y1='55' x2='335' y2='125' stroke='#dc2626' stroke-width='1.5'/>
  <text x='330' y='90' text-anchor='middle' fill='#dc2626' font-size='13' font-weight='bold' transform='rotate(-90,330,90)'>2.5 cm</text>
  <!-- Figure label -->
  <text x='420' y='170' text-anchor='middle' fill='#b91c1c' font-size='14' font-weight='bold'>Figure W</text>
  <!-- Different badge -->
  <text x='420' y='47' text-anchor='middle' fill='#b91c1c' font-size='12' font-weight='bold'>✗ different size</text>
  <!-- Right angle marker -->
  <rect x='480' y='55' width='10' height='10' fill='none' stroke='#dc2626' stroke-width='1.5'/>
</svg>