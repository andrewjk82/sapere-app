
<svg viewBox="0 0 400 200" width="100%" height="auto" style="max-width:400px;display:block;margin:1rem auto;background-color:#fff;border-radius:12px;border:1px solid #ccc;padding:1rem;" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="40" y1="100" x2="360" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="40" y1="20" x2="40" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Y Ticks -->
  <text x="30" y="25" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="30" y="180" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">-1</text>
  <line x1="37" y1="20" x2="43" y2="20" stroke="#94a3b8" stroke-width="1"/>
  <line x1="37" y1="180" x2="43" y2="180" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- X Ticks -->
  <text x="115" y="115" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">π/2</text>
  <text x="190" y="115" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">π</text>
  <text x="265" y="115" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">3π/2</text>
  <text x="340" y="115" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">2π</text>
  
  <!-- Curves (Amplitude 80, Period 300) -->
  <!-- sin(x): 0->0, pi/2->1, pi->0, 3pi/2->-1, 2pi->0 -->
  <!-- path d="M 40 100 Q 77 20 115 20 T 190 100 T 265 180 T 340 100" -->
  <path d="M 40 100 C 90 20, 140 20, 190 100 C 240 180, 290 180, 340 100" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- cos(x): 0->1, pi/2->0, pi->-1, 3pi/2->0, 2pi->1 -->
  <path d="M 40 20 C 90 20, 140 180, 190 180 C 240 180, 290 20, 340 20" fill="none" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Legend -->
  <text x="300" y="30" font-family="sans-serif" font-size="12" fill="#2563eb" font-weight="bold">sin(x)</text>
  <text x="250" y="30" font-family="sans-serif" font-size="12" fill="#dc2626" font-weight="bold">cos(x)</text>

  <!-- Intersections -->
  <circle cx="77.5" cy="43.4" r="4" fill="#8b5cf6"/>
  <text x="77.5" y="32" font-family="sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="bold">π/4</text>
  
  <circle cx="227.5" cy="156.5" r="4" fill="#8b5cf6"/>
  <text x="227.5" y="175" font-family="sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="bold">5π/4</text>
</svg>