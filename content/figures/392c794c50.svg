<svg width="440" height="320" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="440" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step Banner -->
  <rect x="16" y="12" width="408" height="28" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="220" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce">
    Step 3: Common Side (S in RHS) — PM is Shared
  </text>

  <!-- Triangle Base & Hypotenuses faint -->
  <polygon points="220,60 100,250 340,250" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Right angle marks -->
  <path d="M 220 236 L 206 236 L 206 250" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <path d="M 220 236 L 234 236 L 234 250" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>

  <!-- Hypotenuses ticks -->
  <line x1="153" y1="151" x2="167" y2="159" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="273" y1="159" x2="287" y2="151" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Highlighted Shared Side PM -->
  <line x1="220" y1="60" x2="220" y2="250" stroke="#7c3aed" stroke-width="3.8" filter="url(#glow-purple)"/>

  <!-- Vertices -->
  <circle cx="220" cy="60" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="100" cy="250" r="4.5" fill="#64748b"/>
  <circle cx="340" cy="250" r="4.5" fill="#64748b"/>
  <circle cx="220" cy="250" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="220" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">P</text>
  <text x="84" y="266" text-anchor="end" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">R</text>
  <text x="356" y="266" text-anchor="start" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">S</text>
  <text x="220" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold" fill="#0f172a">M</text>

  <!-- Side Badge pointing to PM -->
  <rect x="235" y="130" width="165" height="42" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="317" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">Condition 3 (Side)</text>
  <text x="317" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#5b21b6">PM is common (PM = PM)</text>

  <!-- Left Callout -->
  <rect x="40" y="130" width="140" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <text x="110" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">Shared leg of</text>
  <text x="110" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">ΔPMR and ΔPMS</text>
</svg>