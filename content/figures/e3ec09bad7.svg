<svg viewBox="0 0 400 250" width="100%" height="auto" style="max-width:400px;display:block;margin:1rem auto;background-color:#f8fafc;border-radius:16px;border:1px solid #e2e8f0;padding:1rem;" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker></defs>
  <!-- Hidden Back edges -->
  <line x1="140" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="140" y1="160" x2="140" y2="40" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="60" y1="200" x2="140" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Visible Back edges -->
  <line x1="300" y1="160" x2="300" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="70" x2="200" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="70" x2="200" y2="40" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="40" x2="140" y2="40" stroke="#475569" stroke-width="2"/>
  <!-- Connecting Visible edges -->
  <line x1="220" y1="200" x2="300" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="220" y1="110" x2="300" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="110" x2="200" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="80" x2="200" y2="40" stroke="#475569" stroke-width="2"/>
  <line x1="60" y1="80" x2="140" y2="40" stroke="#475569" stroke-width="2"/>
  <!-- Front face -->
  <polygon points="60,200 220,200 220,110 120,110 120,80 60,80" fill="#dcfce7" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>
  
  <text x="140" y="215" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">16 cm</text>
  <text x="45" y="140" font-family="sans-serif" font-size="14" fill="#475569" transform="rotate(-90 45 140)" text-anchor="middle">12 cm</text>
  
  <line x1="230" y1="210" x2="310" y2="170" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="200" font-family="sans-serif" font-size="14" fill="#475569">14 cm</text>
  
  <text x="170" y="105" font-family="sans-serif" font-size="14" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" text-anchor="middle">10 cm</text>
  <text x="170" y="105" font-family="sans-serif" font-size="14" fill="#166534" text-anchor="middle">10 cm</text>
  <text x="115" y="98" font-family="sans-serif" font-size="14" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" text-anchor="end">3 cm</text>
  <text x="115" y="98" font-family="sans-serif" font-size="14" fill="#166534" text-anchor="end">3 cm</text>

</svg>