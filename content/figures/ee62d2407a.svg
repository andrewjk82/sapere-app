<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>\n  <rect width='300' height='300' fill='#f8fafc' />\n  <g stroke='#e2e8f0' stroke-width='1'>\n    <!-- 10px per unit. grid every 5 units = 50px -->\n    <line x1='0' y1='50' x2='300' y2='50' />\n    <line x1='0' y1='100' x2='300' y2='100' />\n    <line x1='0' y1='200' x2='300' y2='200' />\n    <line x1='0' y1='250' x2='300' y2='250' />\n    <line x1='50' y1='0' x2='50' y2='300' />\n    <line x1='100' y1='0' x2='100' y2='300' />\n    <line x1='200' y1='0' x2='200' y2='300' />\n    <line x1='250' y1='0' x2='250' y2='300' />\n  </g>\n  <line x1='0' y1='150' x2='300' y2='150' stroke='#94a3b8' stroke-width='2' />\n  <line x1='150' y1='0' x2='150' y2='300' stroke='#94a3b8' stroke-width='2' />\n  <!-- Circle r = sqrt(50) = 7.07 units = 70.7px -->\n  <circle cx='150' cy='150' r='70.7' fill='none' stroke='#4f46e5' stroke-width='2' />\n  <circle cx='150' cy='150' r='4' fill='#ef4444' />\n  <text x='158' y='145' font-family='sans-serif' font-size='12' font-weight='bold' fill='#0f172a'>(0, 0)</text>\n  <!-- Point (5, 5) -> x=150+50=200, y=150-50=100. Actually lies on the circle exactly since 5^2+5^2=50 -->\n  <circle cx='200' cy='100' r='5' fill='#22c55e' />\n  <text x='210' y='95' font-family='sans-serif' font-size='12' font-weight='bold' fill='#15803d'>(5, 5)</text>\n</svg>