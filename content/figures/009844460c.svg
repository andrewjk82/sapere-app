<svg width="280" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- Triangle fill -->
  <polygon points="50,160 230,160 230,60" fill="#eff6ff" stroke="none"/>

  <!-- Sides -->
  <line x1="50" y1="160" x2="230" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="230" y1="160" x2="230" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="50" y1="160" x2="230" y2="60" stroke="#334155" stroke-width="2"/>

  <!-- Right angle box at B -->
  <polyline points="216,160 216,146 230,146" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- θ arc: from horizontal (rightward) sweeping up to hypotenuse direction -->
  <!-- Arc center A=(50,160), r=36, start=(86,160), end=(81.5,142.5) -->
  <path d="M 86,160 A 36,36 0 0 0 81,143" fill="none" stroke="#e11d48" stroke-width="2"/>

  <!-- θ label — well inside the triangle -->
  <text x="88" y="158" font-family="serif" font-style="italic" font-size="17" fill="#e11d48">θ</text>

  <!-- Side labels: just numbers, no text annotations -->
  <!-- Hypotenuse: midpoint of (50,160)-(230,60) = (140,110), offset perpendicular -->
  <text x="118" y="98" font-family="serif" font-size="15" fill="#1d4ed8">2</text>

  <!-- Vertical right side: midpoint of (230,60)-(230,160) = (230,110) -->
  <text x="238" y="115" font-family="serif" font-size="15" fill="#15803d">1</text>

  <!-- Bottom side: midpoint of (50,160)-(230,160) = (140,160) -->
  <text x="130" y="178" font-family="serif" font-size="14" fill="#7c3aed">√3</text>
</svg>