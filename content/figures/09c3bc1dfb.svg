<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Parallelogram with opposite sides marked equal and lengths labelled 3x centimetres and x centimetres">
  <style>
    text { font-family: Arial, sans-serif; fill: #263449; font-size: 20px; }
    .shape { fill: #dceafe; stroke: #34445a; stroke-width: 4; stroke-linejoin: round; }
    .tick { stroke: #34445a; stroke-width: 3.5; stroke-linecap: round; }
  </style>
  <path class="shape" d="M180 85 L520 85 L590 290 L250 290 Z"/>
  <!-- Matching marks cross each side at its midpoint. -->
  <path class="tick" d="M350 74 V96 M420 279 V301 M204.6 191.1 L225.4 183.9 M544.6 191.1 L565.4 183.9"/>
  <text x="350" y="62" text-anchor="middle">3x cm</text>
  <text x="190" y="194" text-anchor="end">x cm</text>
  <text x="580" y="194" text-anchor="start">x cm</text>
  <text x="420" y="328" text-anchor="middle">3x cm</text>
</svg>
