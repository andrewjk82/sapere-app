<svg width="320" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210">
  <rect width="320" height="210" fill="#f0f7ff" rx="8"/>

  <!-- Horizontal reference (dashed, faded) -->
  <line x1="40" y1="50" x2="290" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Slope: A to B — HYPOTENUSE highlighted -->
  <line x1="40" y1="50" x2="250" y2="170" stroke="#2563eb" stroke-width="4"/>

  <!-- Vertical drop: C to B — OPPOSITE highlighted -->
  <line x1="250" y1="50" x2="250" y2="170" stroke="#16a34a" stroke-width="4"/>

  <!-- Horizontal dashed (faded) -->
  <line x1="40" y1="50" x2="250" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Right angle -->
  <rect x="238" y="158" width="12" height="12" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Angle arc -->
  <path d="M 90,50 A 50,50 0 0 1 75,76" fill="none" stroke="#e11d48" stroke-width="2"/>
  <text x="95" y="68" font-family="serif" font-size="16" fill="#e11d48" font-style="italic">θ</text>

  <!-- Labels -->
  <text x="22" y="46" font-family="sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">A</text>
  <text x="256" y="178" font-family="sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">B</text>
  <text x="256" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">C</text>

  <!-- Hypotenuse label -->
  <rect x="90" y="90" width="140" height="22" rx="4" fill="#dbeafe"/>
  <text x="160" y="106" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8" font-weight="bold">Hypotenuse = 415 m</text>

  <!-- Opposite label -->
  <rect x="258" y="98" width="56" height="36" rx="4" fill="#dcfce7"/>
  <text x="286" y="112" text-anchor="middle" font-family="serif" font-size="11" fill="#15803d" font-weight="bold">Opp =</text>
  <text x="286" y="127" text-anchor="middle" font-family="serif" font-size="11" fill="#15803d" font-weight="bold">115 m</text>
</svg>