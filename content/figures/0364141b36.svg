<svg width="480" height="340" viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="480" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Sub-heading banner -->
  <rect x="16" y="14" width="448" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="240" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Step 3: Calculating Key Points (Inflection &amp; Intercepts)</text>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3">
    <line x1="220" y1="50" x2="220" y2="310"/>
    <line x1="297" y1="50" x2="297" y2="310"/>
    <line x1="30" y1="135" x2="450" y2="135"/>
  </g>

  <!-- Axes -->
  <line x1="30" y1="230" x2="450" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="220" y1="315" x2="220" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="456" y="234" font-family="serif" font-size="13" font-weight="bold" fill="#475569">x</text>
  <text x="220" y="44" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#475569">y</text>

  <!-- Ticks -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="216" y1="135" x2="224" y2="135"/><text x="210" y="139" text-anchor="end" font-family="sans-serif" font-size="10" fill="#64748b">5</text>
    <line x1="297" y1="226" x2="297" y2="234"/><text x="297" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">≈1.19</text>
  </g>

  <!-- Curve faint backbone -->
  <polyline points="138.8,23.7 140.7,31.5 142.7,38.9 144.6,46.0 146.6,52.8 148.5,59.1 150.5,65.2 152.4,70.9 154.4,76.3 156.3,81.4 158.3,86.1 160.2,90.6 162.2,94.8 164.1,98.7 166.1,102.4 168.0,105.8 170.0,109.0 171.9,111.9 173.9,114.6 175.8,117.1 177.8,119.3 179.7,121.4 181.7,123.3 183.6,125.0 185.6,126.5 187.5,127.9 189.5,129.1 191.4,130.1 193.4,131.1 195.3,131.9 197.3,132.6 199.2,133.1 201.2,133.6 203.1,134.0 205.1,134.3 207.0,134.5 209.0,134.7 210.9,134.8 212.9,134.9 214.8,135.0 216.8,135.0 218.7,135.0 220.7,135.0 222.6,135.0 224.6,135.0 226.5,135.1 228.5,135.1 230.4,135.2 232.4,135.4 234.3,135.6 236.3,135.9 238.2,136.3 240.2,136.7 242.1,137.2 244.1,137.9 246.0,138.6 248.0,139.5 249.9,140.5 251.9,141.7 253.8,143.0 255.8,144.5 257.7,146.1 259.7,147.9 261.6,149.9 263.6,152.1 265.5,154.6 267.5,157.2 269.4,160.0 271.4,163.1 273.3,166.4 275.3,170.0 277.2,173.8 279.2,178.0 281.1,182.3 283.1,187.0 285.0,192.0 287.0,197.3 288.9,202.9 290.9,208.8 292.8,215.1 294.8,221.7 296.7,228.7 298.7,236.0 300.6,243.7 302.6,251.8 304.5,260.2 306.5,269.1 308.4,278.4 310.4,288.1 312.3,298.2 314.3,308.8" fill="none" stroke="#7c3aed" stroke-width="2.2" opacity="0.35"/>

  <!-- Horizontal Tangent at (0, 5) -->
  <line x1="160" y1="135" x2="280" y2="135" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="160" y="123" text-anchor="start" font-family="sans-serif" font-size="10" font-weight="700" fill="#b45309">Horizontal tangent at (0, 5): y′ = 0</text>

  <!-- Point 1: Inflection Point & y-intercept (0, 5) -->
  <circle cx="220" cy="135" r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="232" y="138" width="158" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="240" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Point of Inflection &amp; y-intercept</text>
  <text x="240" y="166" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4c1d95">(0, 5)  [x = 0 ⇒ y = 5]</text>

  <!-- Point 2: x-intercept (cbrt(5/3), 0) -->
  <circle cx="297.1" cy="230" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <rect x="280" y="258" width="170" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="288" y="272" font-family="sans-serif" font-size="10" font-weight="700" fill="#c2410c">x-intercept: set y = 0</text>
  <text x="288" y="286" font-family="sans-serif" font-size="9.5" fill="#9a3412">5 − 3x³ = 0 ⇒ x³ = 5/3</text>
  <text x="288" y="299" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">x = ∛(5/3) ≈ 1.186 ⇒ (1.19, 0)</text>

  <!-- Guide Point (-1, 8) -->
  <circle cx="155" cy="78" r="4" fill="#64748b"/>
  <text x="145" y="75" text-anchor="end" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#475569">(−1, 8)</text>

  <!-- Guide Point (1, 2) -->
  <circle cx="285" cy="192" r="4" fill="#64748b"/>
  <text x="275" y="196" text-anchor="end" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#475569">(1, 2)</text>
</svg>