<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 112" width="480" height="112" role="img"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="10" y="13" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#64748b">USE THE HIGHLIGHTED INFORMATION</text><rect x="10" y="18" width="148" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#172554"><tspan x="84" y="49">S4=a(1+r+r^2+r³)</tspan></text><path d="M 159 45 h 6 l -5 -4 m 5 4 l -5 4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="166" y="18" width="148" height="54" rx="10" fill="#fff0a8" stroke="#f0b429" stroke-width="2"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#172554"><tspan x="240" y="49">S2=a(1+r)</tspan></text><path d="M 315 45 h 6 l -5 -4 m 5 4 l -5 4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="322" y="18" width="148" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#172554"><tspan x="396" y="49">S4 = 17S2</tspan></text></svg>
