<svg viewBox="0 0 300 120" width="300" height="120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:2rem auto;background-color:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;">
  <!-- Main Path -->
  <line x1="30" y1="60" x2="270" y2="60" stroke="#475569" stroke-width="3"/>
  
  <!-- Total Distance Bracket -->
  <path d="M 30 35 L 30 25 L 270 25 L 270 35" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="18" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#64748b">Total Distance: D</text>

  <!-- Segment Distances -->
  <path d="M 30 75 L 30 85 L 110 85 L 110 75" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2563eb">9 km</text>

  <path d="M 110 75 L 110 85 L 270 85 L 270 75" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#16a34a">D - 9 km</text>

  <!-- Points -->
  <circle cx="30" cy="60" r="5" fill="#1e293b"/>
  <circle cx="110" cy="60" r="5" fill="#dc2626"/>
  <circle cx="270" cy="60" r="5" fill="#1e293b"/>

  <!-- Labels -->
  <text x="30" y="50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Home</text>
  <text x="110" y="50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#dc2626">Meeting</text>
  <text x="270" y="50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Uni</text>
</svg>