<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#f8fafc" rx="8"/>
  <!-- North line -->
  <line x1="150" y1="200" x2="150" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="155" y="25" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="bold">N</text>
  <!-- Full bearing arc showing 340 deg -->
  <path d="M 150 155 A 45 45 0 1 1 136.4 157.4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="155" y="148" font-family="serif" font-size="13" fill="#3b82f6" font-weight="bold">340°</text>
  <!-- Direct flight line (hyp) -->
  <line x1="150" y1="200" x2="100" y2="55" stroke="#e11d48" stroke-width="2.5"/>
  <text x="60" y="125" font-family="serif" font-size="13" fill="#e11d48" font-weight="bold">16 km</text>
  <!-- Start point -->
  <circle cx="150" cy="200" r="4" fill="#1d4ed8"/>
  <text x="158" y="215" font-family="sans-serif" font-size="11" fill="#1d4ed8">Start</text>
  <!-- End point -->
  <circle cx="100" cy="55" r="4" fill="#e11d48"/>
  <text x="72" y="52" font-family="sans-serif" font-size="11" fill="#e11d48">Plane</text>
</svg>