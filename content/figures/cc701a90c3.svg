<svg width="340" height="110" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110">
  <rect width="340" height="110" fill="#f8fafc" rx="8"/>
  <text x="170" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569" font-weight="bold">Translation Rules</text>
  <!-- Box 1: x replaced by x-4 -->
  <rect x="10" y="28" width="150" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="85" y="44" text-anchor="middle" font-family="serif" font-size="12" fill="#15803d" font-weight="bold">x → (x − 4)</text>
  <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">Shift RIGHT 4 units</text>
  <!-- Box 2: subtract 1 -->
  <rect x="180" y="28" width="150" height="38" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="255" y="44" text-anchor="middle" font-family="serif" font-size="12" fill="#be123c" font-weight="bold">… − 1</text>
  <text x="255" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#be123c">Shift DOWN 1 unit</text>
  <!-- inflection move -->
  <text x="170" y="97" text-anchor="middle" font-family="serif" font-size="13" fill="#0f172a">Inflection: (0, 0) → (0 + 4,  0 − 1) = <tspan font-weight="bold" fill="#7c3aed">(4, −1)</tspan></text>
</svg>