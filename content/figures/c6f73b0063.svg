  <!-- beta at P: PB (60) to PO (90) -->
  <path d='M 170 84.64101615137754 A 40 40 0 0 1 150 90' fill='none' stroke='#8b5cf6' stroke-width='1.5' stroke-linecap='round' />
  <text x='164.23504748063863' y='107.12592044589876' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#7c3aed'>β</text>

  <!-- 2alpha at O: OX (90) to OA (150) -->
  <path d='M 150 180 A 30 30 0 0 1 124.01923788646684 165' fill='none' stroke='#f59e0b' stroke-width='1.5' stroke-linecap='round' />
  <text x='127.50000000000001' y='193.97114317029974' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#d97706'>2α</text>

  <!-- 2beta at O: OB (30) to OX (90) -->
  <path d='M 175.98076211353316 165 A 30 30 0 0 1 150 180' fill='none' stroke='#8b5cf6' stroke-width='1.5' stroke-linecap='round' />
  <text x='172.5' y='193.97114317029974' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='500' font-style='italic' fill='#7c3aed'>2β</text>

  <!-- Points -->
  <circle cx='150' cy='150' r='3' fill='#94a3b8' stroke='#ffffff' stroke-width='1.5' />
  <text x='150' y='142' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>O</text>
  
  <circle cx='63.39745962155612' cy='200' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
