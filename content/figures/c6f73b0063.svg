<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>
  <rect width='300' height='300' fill='#ffffff' />
  
  <!-- Circle -->
  <circle cx='150' cy='150' r='100' fill='none' stroke='#cbd5e1' stroke-width='1.5' />
  
  <!-- Solid lines -->
  <line x1='150' y1='50' x2='63.39745962155612' y2='200' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
