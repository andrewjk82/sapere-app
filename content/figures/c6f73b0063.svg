  <line x1='150' y1='150' x2='236.60254037844388' y2='200' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  
  <!-- Dashed line PX (passing through O) -->
  <line x1='150' y1='50' x2='150' y2='250' stroke='#ef4444' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4' />

  <!-- Angles -->
  <!-- alpha at P: PO (90) to PA (120) -->
  <path d='M 150 90 A 40 40 0 0 1 130 84.64101615137756' fill='none' stroke='#f59e0b' stroke-width='1.5' stroke-linecap='round' />
