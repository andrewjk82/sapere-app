<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 180' width='360' height='180' font-family='sans-serif'>
  <rect width='360' height='180' fill='#f8fafc' rx='8'/>
  <!-- Figure U -->
  <rect x='20' y='40' width='100' height='50' fill='#dbeafe' stroke='#2563eb' stroke-width='2' rx='2'/>
  <line x1='20' y1='40' x2='120' y2='90' stroke='#2563eb' stroke-width='1.5' stroke-dasharray='4,3'/>
  <text x='70' y='110' text-anchor='middle' fill='#1e40af' font-size='12' font-weight='bold'>Figure U</text>
  <text x='70' y='124' text-anchor='middle' fill='#2563eb' font-size='11'>4 × 2</text>
  <!-- VS -->
  <text x='165' y='80' text-anchor='middle' fill='#64748b' font-size='22' font-weight='bold'>vs</text>
  <!-- Figure V (rotated) -->
  <rect x='210' y='20' width='50' height='100' fill='#dcfce7' stroke='#16a34a' stroke-width='2' rx='2'/>
  <line x1='210' y1='20' x2='260' y2='120' stroke='#16a34a' stroke-width='1.5' stroke-dasharray='4,3'/>
  <text x='235' y='138' text-anchor='middle' fill='#15803d' font-size='12' font-weight='bold'>Figure V</text>
  <text x='235' y='152' text-anchor='middle' fill='#16a34a' font-size='11'>2 × 4</text>
  <!-- Congruent arrow -->
  <text x='285' y='78' fill='#15803d' font-size='28' font-weight='bold'>≅</text>
  <text x='308' y='95' fill='#15803d' font-size='11' font-weight='bold'>Same</text>
  <text x='308' y='108' fill='#15803d' font-size='11' font-weight='bold'>sides!</text>
  <!-- rotation note -->
  <text x='165' y='168' text-anchor='middle' fill='#15803d' font-size='12'>90° rotation — congruent ✓</text>
</svg>