<svg width="340" height="240" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240">
  <rect width="340" height="240" fill="#f0f9ff" rx="8"/>
  
  <line x1="0" y1="180" x2="340" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="170" y1="0" x2="170" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="332" y="174" font-family="sans-serif" font-size="11" fill="#94a3b8">x</text>
  <text x="175" y="12" font-family="sans-serif" font-size="11" fill="#94a3b8">y</text>
  
  <!-- original -->
  <path d="M 95 180 A 75 75 0 0 1 245 180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="250" y="195" font-family="sans-serif" font-size="11" fill="#64748b">y = g(x)</text>
  <circle cx="170" cy="180" r="3" fill="#94a3b8"/>
  <text x="174" y="194" font-family="sans-serif" font-size="10" fill="#64748b">(0,0)</text>
  
  <!-- translated UP by 2 -->
  <path d="M 95 130 A 75 75 0 0 1 245 130" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="95" y1="130" x2="245" y2="130" stroke="#fdba74" stroke-dasharray="2,2" stroke-width="1.5"/>
  <text x="250" y="125" font-family="sans-serif" font-size="11" fill="#ea580c">y = g(x) + 2</text>
  
  <!-- new center -->
  <circle cx="170" cy="130" r="4" fill="#ea580c"/>
  <text x="175" y="125" font-family="serif" font-size="12" fill="#9a3412" font-weight="bold">(0, 2)</text>
</svg>