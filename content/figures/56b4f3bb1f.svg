<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'>
  <rect width='300' height='300' fill='#ffffff' />
  
  <circle cx='150' cy='150' r='100' fill='none' stroke='#cbd5e1' stroke-width='1.5' />
  
  <!-- Parallel Lines -->
  <line x1='51.5192246987792' y1='132.63518223330698' x2='248.4807753012208' y2='132.63518223330698' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />
  <line x1='63.39745962155614' y1='200' x2='236.60254037844385' y2='200.00000000000006' stroke='#64748b' stroke-width='1.5' stroke-linecap='round' />

  <!-- Parallel markers -->
  <path d='M 145 127.6 L 150 132.6 L 145 137.6' fill='none' stroke='#64748b' stroke-width='1.5' stroke-linejoin='round' />
  <path d='M 152 127.6 L 157 132.6 L 152 137.6' fill='none' stroke='#64748b' stroke-width='1.5' stroke-linejoin='round' />
  <path d='M 145 195 L 150 200 L 145 205' fill='none' stroke='#64748b' stroke-width='1.5' stroke-linejoin='round' />
  <path d='M 152 195 L 157 200 L 152 205' fill='none' stroke='#64748b' stroke-width='1.5' stroke-linejoin='round' />

  <!-- Radii for central angle -->
  <line x1='150' y1='150' x2='63.39745962155614' y2='200' stroke='#94a3b8' stroke-width='1.5' stroke-linecap='round' />
  <line x1='150' y1='150' x2='236.60254037844385' y2='200.00000000000006' stroke='#94a3b8' stroke-width='1.5' stroke-linecap='round' />

  <!-- Chords for inscribed angles -->
  <line x1='51.5192246987792' y1='132.63518223330698' x2='63.39745962155614' y2='200' stroke='#3b82f6' stroke-width='1.5' stroke-linecap='round' />
  <line x1='51.5192246987792' y1='132.63518223330698' x2='236.60254037844385' y2='200.00000000000006' stroke='#3b82f6' stroke-width='1.5' stroke-linecap='round' />

  <!-- Angle AOB = 120 -->
  <!-- Start at A (210 deg math), go CCW to B (330 deg math). In SVG sweep=0 (counter-clockwise math) -->
  <path d='M 128.34936490538902 162.5 A 25 25 0 0 0 171.65063509461095 162.5' fill='none' stroke='#f59e0b' stroke-width='1.5' stroke-linecap='round' />
  <text x='150' y='185' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#d97706'>120°</text>

  <!-- Angle ACD = 80 -->
  <!-- CA is approx 280 deg math, CD is 0 deg math. Sweep from 280 to 0 is 80 deg CCW. -->
  <path d='M 54.9921882521178 152.33133729355114 A 20 20 0 0 0 71.5192246987792 132.63518223330698' fill='none' stroke='#10b981' stroke-width='1.5' stroke-linecap='round' />
  <text x='81.5192246987792' y='127.63518223330698' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#059669'>80°</text>

  <!-- Angle ACB = alpha -->
  <!-- CA is 280 deg, CB is approx 340 deg (-20 deg). Sweep from 280 to 340 is 60 deg CCW. -->
  <path d='M 57.59691091712175 167.10345358873425 A 35 35 0 0 0 84.408466426286 144.60588724970538' fill='none' stroke='#8b5cf6' stroke-width='1.5' stroke-linecap='round' />
  <text x='76.5192246987792' y='167.63518223330698' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#7c3aed'>α</text>

  <!-- Points -->
  <circle cx='150' cy='150' r='3' fill='#94a3b8' stroke='#ffffff' stroke-width='1.5' />
  <text x='150' y='142' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>O</text>
  
  <circle cx='63.39745962155614' cy='200' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='51.39745962155614' y='204' text-anchor='end' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>A</text>
  
  <circle cx='236.60254037844385' cy='200.00000000000006' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='248.60254037844385' y='204.00000000000006' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>B</text>
  
  <circle cx='51.5192246987792' cy='132.63518223330698' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='39.5192246987792' y='136.63518223330698' text-anchor='end' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>C</text>

  <circle cx='248.4807753012208' cy='132.63518223330698' r='4' fill='#3b82f6' stroke='#ffffff' stroke-width='1.5' />
  <text x='260.4807753012208' y='136.63518223330698' text-anchor='start' font-family='sans-serif' font-size='13' font-weight='600' fill='#475569'>D</text>
</svg>