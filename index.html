<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A stale copy of THIS page (served by a mobile carrier's compressing
      // proxy that ignores our no-store header, or just a tab left open
      // across a deploy) can reference a JS/CSS chunk filename that no
      // longer exists once a new deploy replaces it — 404. The in-app
      // ErrorBoundary already auto-recovers from that for lazy-loaded
      // screens, but it can only do that AFTER React has mounted. If the
      // failing file is the entry bundle itself, React never starts and
      // nothing inside the app can react — the page is just permanently
      // blank. Catch that one case here, at the raw HTML level, before
      // React exists, and force a single cache-busted reload.
      (function () {
        var KEY = 'sapere:entry-reload';
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var url = t.src || t.href || '';
          if (!/\/assets\//.test(url)) return;
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 60000) return; // already retried once recently — avoid a loop
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (err) { /* storage unavailable (private mode etc.) — still try one reload */ }
          var sep = location.search ? '&' : '?';
          var go = function () { location.replace(location.pathname + location.search + sep + '_cb=' + Date.now() + location.hash); };
          // A leftover service worker (old /sw.js passed every request through its own fetch) or a stale Cache
          // Storage entry can keep failing the same file on every reload. Drop both before the one retry.
          var jobs = [];
          try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (err) { /* ignore */ }
          try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (err) { /* ignore */ }
          var done = false;
          var fin = function () { if (!done) { done = true; go(); } };
          Promise.all(jobs).then(fin, fin);
          setTimeout(fin, 1500);
        }, true);
      })();
    </script>
    <script>
      // Boot diagnostics: if React has put nothing in #root after 7s, show what failed (instead of a blank page).
      (function () {
        var errs = [];
        function add(m) { errs.push(String(m).slice(0, 300)); }
        window.addEventListener('error', function (e) {
          var t = e.target;
          var u = t && (t.src || t.href);
          if (!u) { add((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || '')); return; }
          add('load failed: ' + u);
          // Probe the same file to see what the browser actually gets (status / network error).
          try {
            fetch(u, { cache: 'no-store', mode: 'cors' }).then(function (res) {
              return res.text().then(function (b) { add('  probe ' + res.status + ' ' + (res.headers.get('content-type') || '') + ' ' + b.length + 'B'); });
            }, function (err) { add('  probe error: ' + (err && err.message)); });
          } catch (err) { add('  probe threw: ' + err.message); }
        }, true);
        try { add('sw: ' + ((navigator.serviceWorker && navigator.serviceWorker.controller && navigator.serviceWorker.controller.scriptURL) || 'none')); } catch (err) { /* ignore */ }
        window.addEventListener('unhandledrejection', function (e) { add('promise: ' + (e.reason && (e.reason.message || e.reason))); });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (!r || r.childNodes.length) return;
          var d = document.createElement('div');
          d.style.cssText = 'padding:24px;font:14px system-ui;color:#4a2f2a;word-break:break-all';
          d.innerHTML = '<b>Could not start the app.</b><br>Pull down to reload, or send this to your teacher:<pre style="white-space:pre-wrap;font-size:11px"></pre>';
          d.querySelector('pre').textContent = (errs.join('\n') || 'no error captured') + '\n' + navigator.userAgent;
          r.appendChild(d);
        }, 7000);
      })();
    </script>

         A slow/blocked Google Fonts must never hold up the first screen. (Sora was unused — dropped.) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Bebas+Neue&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

         no render-blocking third-party CDN on the first screen. -->
